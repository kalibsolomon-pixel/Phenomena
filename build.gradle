plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}
version = project.mod_version
group = 'dev.kwamster'
base { archivesName = 'kwamster' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
test { useJUnitPlatform() }

fabricApi { configureTests { createSourceSet = true; modId = 'kwamster-test'; enableGameTests = false; enableClientGameTests = true; clearRunDirectory = false } }

processGametestResources {
    def mode = providers.gradleProperty('performance').orElse('functional')
    inputs.property 'testMode', mode
    filesMatching('fabric.mod.json') {
        expand 'entrypoint': mode.get() == 'baseline' ? 'dev.kwamster.FabricBaselineTest' : mode.get() == 'mod' ? 'dev.kwamster.ModPerformanceTest' : 'dev.kwamster.KwamsterGameTest'
    }
}
loom.runs.clientGameTest {
    vmArg '-Dkwamster.perfOutput=' + layout.buildDirectory.dir(providers.gradleProperty('validationRun').map { 'performance/' + it }.orElse('performance').get()).get().asFile.absolutePath
    if (providers.gradleProperty('performance').orNull in ['baseline', 'mod']) vmArg '-Dfabric.modsFolder=' + layout.buildDirectory.dir('performance/mods').get().asFile.absolutePath
    // Packet-observation mixins require Fabric's test packet synchronizer to be disabled.
    vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    if (providers.gradleProperty('performance').orNull == 'baseline') vmArg '-Dfabric.debug.disableModIds=kwamster'
    // -PrealOpen=true lets the client test launch the real file manager and browser once.
    if (providers.gradleProperty('realOpen').orNull == 'true') vmArg '-Dkwamster.realOpen=true'
}

tasks.register('benchmarkAnalytics', JavaExec) {
    group = 'verification'
    description = 'Measure synthetic event processing, allocation and atomic recording overhead'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.kwamster.AnalyticsBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

// Preserve previous test-client directories, screenshots and recordings during acceptance runs.
if (providers.gradleProperty('validationRun').isPresent()) {
    def label = providers.gradleProperty('validationRun').get()
    if (!(label ==~ /[a-zA-Z0-9_-]+/)) throw new GradleException('Invalid validation run name')
    loom.runs.clientGameTest.runDir('build/run/' + label)
}

