<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>KWAMSTER Fight Report</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111417;--surface:#1b2025;--surface-2:#22282d;--hover:#2c3338;--pressed:#16191c;
  --border:#3b434b;--border-soft:#2c3238;--grid:#2a3036;
  --text:#e6ecea;--muted:#9aa6ac;--dim:#7d878d;
  --accent:#88c8aa;--warn:#e4c46e;
  --you:#3987e5;--opp:#d95926;--good:#199e70;--neutral:#8a949a;--incomplete:#5e676d;
  --ideal:#56b4e9;--goodaim:#009e73;--peripheral:#e69f00;--poor:#cc79a7;
  --mono:"Minecraft","Minecraftia","Monocraft",ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 var(--mono);letter-spacing:.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}
header.top{background:#15191c;border-bottom:1px solid var(--border-soft)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;color:var(--accent)}
.sub{color:var(--dim)}
.badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.badge{border:1px solid var(--border);padding:1px 7px;color:var(--muted);font-size:12px}
.ident{padding:16px 0 4px}
.ident h1{font-size:18px;margin:0 0 4px;font-weight:700}
.ident p{margin:0;color:var(--muted)}
nav.tabs{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--border-soft);overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--text)}
nav.tabs button[aria-selected=true]{background:var(--surface);color:var(--text);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main.panel{background:var(--surface);border:1px solid var(--border-soft);border-top:0;padding:16px}
section[role=tabpanel]{display:none}
section[role=tabpanel].on{display:block}
nav.sections{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
nav.sections a{color:var(--muted);border:1px solid var(--border);padding:2px 9px;text-decoration:none;font-size:12px}
nav.sections a:hover{color:var(--text);background:var(--surface-2)}
h2{font-size:14px;font-weight:700;margin:24px 0 8px;display:flex;align-items:center;gap:10px;scroll-margin-top:8px}
h2:first-child,nav.sections+h2{margin-top:6px}
h2::after{content:"";flex:1;height:1px;background:var(--border-soft)}
h2 small{color:var(--dim);font-weight:400;order:2}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.card{background:var(--surface-2);padding:8px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);min-width:0}
.card .l{color:var(--muted);font-size:12px}
.card .v{font-size:18px;font-weight:700;margin:2px 0;overflow-wrap:anywhere}
.card .v.none{color:var(--dim)}
.card .c{color:var(--dim);font-size:11px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 6px;align-items:baseline}
.card.result .v{font-size:16px}
.tag{display:inline-block;font-size:10px;border:1px solid var(--border);color:var(--dim);padding:0 4px;white-space:nowrap;margin-left:auto}
.note{background:rgba(34,40,45,.6);border-left:2px solid var(--border);padding:8px 12px;color:var(--muted);margin:10px 0}
.note.warn{border-left-color:var(--warn)}
ul.facts{margin:6px 0 0;padding-left:18px;color:var(--text)}
ul.facts li{margin:3px 0}
p.muted{color:var(--muted);margin:6px 0}
button.mc,select.mc,select{background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:5px 10px;font:inherit;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.25);max-width:100%}
button.mc:hover,select:hover{background:var(--hover)}
button.mc:active{background:var(--pressed);box-shadow:none}
button.mc[aria-pressed=true]{border-color:var(--accent)}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.controls label{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.controls output{color:var(--muted);min-width:120px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.chart{position:relative;background:rgba(34,40,45,.55);margin:4px 0}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:4px 0 2px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
.legend i.hollow{background:transparent!important;border:2px solid}
.legend i.dotted{background:repeating-linear-gradient(45deg,var(--incomplete) 0 2px,transparent 2px 4px)!important}
.tip{position:absolute;pointer-events:none;background:#0d0f11;border:1px solid var(--border);padding:3px 7px;font-size:12px;white-space:nowrap;display:none;z-index:2;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--border-soft)}
th{color:var(--dim);font-weight:400;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right}
tr.cur td,tr.sel td{background:var(--hover)}
.scroll{max-height:360px;overflow:auto;border:1px solid var(--border-soft)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0}
.annot{background:var(--surface-2);border-left:2px solid var(--accent);padding:8px 12px;min-height:38px}
.annot b{font-weight:700}
.empty{color:var(--muted);padding:18px;text-align:center}
svg .sel{stroke:var(--text);stroke-width:2}
svg [tabindex]{cursor:pointer}
footer{color:var(--dim);font-size:12px;padding-top:14px}
@media (max-width:720px){.split{grid-template-columns:1fr}.badges{margin-left:0}main.panel{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.reduced *{transition:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand">KWAMSTER</span><span class="sub">Fight report</span><span class="badges" id="badges"></span></div></header>
<div class="wrap">
<div class="ident"><h1 id="title">Fight</h1><p id="subtitle"></p></div>

<section role="tabpanel" id="p-flow" aria-labelledby="t-flow"></section>
<section role="tabpanel" id="p-timeline" aria-labelledby="t-timeline"></section>
</main>
<footer>Generated locally by KWAMSTER. This file makes no network requests and nothing was uploaded. Share the folder yourself if you choose.</footer>

// ---- generic charts ----
function tip(box){const t=el('div',{class:'tip'});box.append(t);return t;}
function place(t,box,x,y,text){t.textContent=text;t.style.display='block';const r=box.getBoundingClientRect();let left=x-r.left+12;if(left+t.offsetWidth>r.width)left=x-r.left-t.offsetWidth-12;t.style.left=Math.max(0,left)+'px';t.style.top=Math.max(0,y-r.top-28)+'px';}
function hoverTip(node,t,box,text){node.addEventListener('mousemove',ev=>place(t,box,ev.clientX,ev.clientY,text));node.addEventListener('mouseleave',()=>t.style.display='none');}
function legend(parent,items){const l=el('div',{class:'legend'});for(const it of items){const s=el('span');const i=el('i',it.hollow?{class:'hollow'}:it.dotted?{class:'dotted'}:null);if(it.hollow)i.style.borderColor=it.color;else i.style.background=it.color;s.append(i,document.createTextNode(it.name));l.append(s);}parent.append(l);}
function chartBox(parent,W,H,aria){const box=el('div',{class:'chart'});const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':aria});box.append(svg);parent.append(box);return{box,svg,t:tip(box)};}
function emptyText(svg,W,H,text){svgText(svg,W/2,H/2,text,{'text-anchor':'middle',fill:'#9aa6ac','font-size':13});}
function timeAxis(svg,L,R,y,W,maxT){for(const v of[0,maxT/4,maxT/2,3*maxT/4,maxT]){const x=L+(W-L-R)*v/maxT;svg.append(sv('line',{x1:x,x2:x,y1:y,y2:y+4,stroke:'#3b434b'}));svgText(svg,x,y+16,num(v,1)+' s',{'text-anchor':v===0?'start':v===maxT?'end':'middle'});}}
function stack(parent,items,aria){const total=items.reduce((a,b)=>a+b.v,0);const W=900,H=18;const{box,svg,t}=chartBox(parent,W,H,aria||items.map(i=>i.name+' '+i.v).join(', '));let x=0;for(const it of items){if(!total||!it.v)continue;const w=W*it.v/total;const r=sv('rect',{x,y:0,width:Math.max(1,w-2),height:H,fill:it.color});hoverTip(r,t,box,it.name+': '+it.v+' ('+pct(100*it.v/total)+')');svg.append(r);x+=w;}if(!total)emptyText(svg,W,H,'No observations');const l=el('div',{class:'legend'});for(const it of items){const s=el('span');const i=el('i');i.style.background=it.color;s.append(i,document.createTextNode(it.name+' '+it.v));l.append(s);}parent.append(l);}
function table(parent,heads,rows,right,max){const wrap=el('div',{class:'scroll'});const t=el('table');const tr=el('tr');heads.forEach((h,i)=>tr.append(el('th',right&&right[i]?{class:'r',scope:'col'}:{scope:'col'},h)));const th=el('thead');th.append(tr);t.append(th);const tb=el('tbody');for(const r of rows.slice(0,max||rows.length)){const row=el('tr');r.forEach((c,i)=>row.append(el('td',right&&right[i]?{class:'r'}:null,c)));tb.append(row);}t.append(tb);wrap.append(t);parent.append(wrap);if(!rows.length)parent.append(el('p',{class:'muted'},'No rows.'));return tb;}
function bars(parent,o){
  const W=900,H=o.h||180,L=40,R=10,T=10,B=24;const{box,svg,t}=chartBox(parent,W,H,o.aria||'');
  const n=o.labels.length,g=o.groups.length;let max=0;for(const gr of o.groups)for(const v of gr.values)max=Math.max(max,v);
  const top=Math.max(1,max);for(const v of[0,top]){const y=T+(H-T-B)*(1-v/top);svg.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:v?'#2a3036':'#3b434b'}));svgText(svg,L-6,y+4,String(v),{'text-anchor':'end'});}
  const slot=(W-L-R)/n,bw=Math.min(28,(slot-6)/g);
  o.labels.forEach((lab,i)=>{o.groups.forEach((gr,k)=>{const v=gr.values[i]||0,h=(H-T-B)*v/top,x=L+i*slot+(slot-bw*g)/2+k*bw;const color=gr.colors?gr.colors[i]:gr.color;svg.append(sv('rect',{x:x+1,y:H-B-h,width:Math.max(1,bw-2),height:Math.max(0,h),fill:color}));const hit=sv('rect',{x,y:T,width:bw,height:H-T-B,fill:'transparent'});hoverTip(hit,t,box,lab+' · '+gr.name+': '+v);svg.append(hit);});
    svgText(svg,L+i*slot+slot/2,H-7,lab,{'text-anchor':'middle'});});
  if(!max)emptyText(svg,W,H,o.empty||'No samples');

}

/** Two-lane combo timeline; combos are selectable (click, Enter) and listed in the select. */
function comboTimeline(parent,onSelect){
  const W=900,H=150,L=86,R=12,T=14,LH=36,G=14;const{box,svg,t}=chartBox(parent,W,H,'Combo timeline: your confirmed hits above, attributed opponent hits below; combos are bands labeled with their length');
  const tx=v=>L+(W-L-R)*Math.max(0,Math.min(1,v/dur));const top=T,bot=T+LH+G;
  svgText(svg,8,top+LH/2+4,'You',{fill:'#3987e5'});svgText(svg,8,bot+LH/2+4,'Opponent',{fill:'#d95926'});
  for(const y of[top,bot])svg.append(sv('rect',{x:L,y,width:W-L-R,height:LH,fill:'rgba(34,40,45,.9)'}));
  for(const ex of combos.exchanges||[])svg.append(sv('line',{x1:tx(ex.start)-3,x2:tx(ex.start)-3,y1:top,y2:bot+LH,stroke:'#2a3036'}));
  const bands=[];
  comboList.forEach((c,i)=>{const local=c.side==='LOCAL',y=local?top:bot,x0=tx(c.start)-4,x1=Math.max(x0+8,tx(c.end)+4);
    const r=sv('rect',{x:x0,y:y+5,width:x1-x0,height:LH-10,rx:3,fill:local?'rgba(57,135,229,.35)':'rgba(217,89,38,.35)',tabindex:0,role:'button','aria-label':(local?'Your':'Opponent')+' combo of '+c.length+' hits at '+num(c.start,2)+' s'});
    r.addEventListener('click',()=>onSelect(i));r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onSelect(i);}});
    hoverTip(r,t,box,(local?'Your':'Opponent')+' combo: '+c.length+' hits, '+num(c.end-c.start,2)+' s, ended by '+endWord[c.endedBy]);svg.append(r);bands.push(r);
    svgText(svg,(x0+x1)/2,local?y+3:y+LH+10,'×'+c.length,{'text-anchor':'middle',fill:'#e6ecea','font-size':12});});
  for(const m of combos.marks||[]){const local=m.side==='LOCAL',y=local?top:bot,x=tx(m.t),color=local?'var(--you)':'var(--opp)';
    const n=m.traded?sv('rect',{x:x-4,y:y+LH/2-4,width:8,height:8,fill:'none',stroke:color,'stroke-width':2}):sv('rect',{x:x-1.5,y:y+9,width:3,height:LH-18,fill:color});
    hoverTip(n,t,box,(local?'Your confirmed hit':'Attributed opponent hit')+' at '+num(m.t,2)+' s'+(m.traded?' (same-tick trade)':''));svg.append(n);}
  timeAxis(svg,L,R,bot+LH+4,W,dur);
  if(!(combos.marks||[]).length)emptyText(svg,W,H,'No confirmed hits in this fight');
  legend(parent,[{name:'Your hit',color:'var(--you)'},{name:'Attributed opponent hit',color:'var(--opp)'},{name:'Same-tick trade',color:'var(--muted)',hollow:true},{name:'Combo band (×length)',color:'rgba(57,135,229,.55)'}]);
  return i=>bands.forEach((b,k)=>b.classList.toggle('sel',k===i));
}
/** Dominance: positive = you, negative = opponent; gaps where evidence is insufficient. */
function dominanceChart(parent){
  if(!dom){note(parent,'Dominance data unavailable in this report version.');return;}
  const W=900,H=260,L=64,R=12,T=12,B=40,PH=H-T-B-14;const{box,svg,t}=chartBox(parent,W,H,'Encounter dominance over time. Above the centerline favors you, below favors the opponent. Empty columns have no evidence; dotted columns have unattributed incoming damage.');
  const step=dom.step,vals=dom.values||[],st=dom.states||'',maxT=Math.max(dur,(vals.length-1)*step);
  const tx=v=>L+(W-L-R)*v/maxT,ty=v=>T+PH/2-v*(PH/2-2),zero=ty(0);
  svg.append(sv('rect',{x:L,y:T,width:W-L-R,height:PH,fill:'rgba(34,40,45,.9)'}));
  svgText(svg,L-6,T+10,'+1 you',{'text-anchor':'end',fill:'#3987e5'});svgText(svg,L-6,zero+4,'0',{'text-anchor':'end'});svgText(svg,L-6,T+PH-2,'−1 opp',{'text-anchor':'end',fill:'#d95926'});
  for(const b of D.boundaries||[])if(b.accepted&&['START','ROUND_START','RESULT'].includes(b.kind)){const x=tx(b.time);svg.append(sv('line',{x1:x,x2:x,y1:T,y2:T+PH,stroke:'#59636b','stroke-dasharray':'3 3'}));const right=x>W-R-60;svgText(svg,right?x-2:x+2,T+9,cap(b.kind),{'font-size':9,'text-anchor':right?'end':'start'});}
  const color={L:'rgba(57,135,229,.55)',O:'rgba(217,89,38,.55)',N:'rgba(138,148,154,.45)'};
  let d='',pen=false;
  for(let k=0;k<vals.length;k++){const v=vals[k],s=st[k];const x=tx(k*step),w=Math.max(1,tx(step)-tx(0)+.5);
    if(v==null||s==='I'){pen=false;continue;}
    const y=ty(v);if(s==='C')svg.append(sv('rect',{x,y:Math.min(y,zero),width:w,height:Math.abs(zero-y)+1,fill:'url(#dots)'}));else svg.append(sv('rect',{x,y:Math.min(y,zero),width:w,height:Math.abs(zero-y)+.5,fill:color[s]}));
    d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);pen=true;}
  const defs=sv('defs');const pat=sv('pattern',{id:'dots',width:4,height:4,patternUnits:'userSpaceOnUse'});pat.append(sv('rect',{width:2,height:2,fill:'#5e676d'}));defs.append(pat);svg.prepend(defs);
  svg.append(sv('path',{d,fill:'none',stroke:'#e6ecea','stroke-width':1.5,'stroke-opacity':.85}));
  svg.append(sv('line',{x1:L,x2:W-R,y1:zero,y2:zero,stroke:'#e6ecea','stroke-opacity':.6}));
  for(const c of comboList)if(c.side==='LOCAL')svg.append(sv('rect',{x:tx(c.start),y:T+3,width:Math.max(2,tx(c.end)-tx(c.start)),height:3,fill:'var(--you)'}));
  for(const m of combos.marks||[]){const x=tx(m.t);svg.append(m.side==='LOCAL'?sv('rect',{x:x-.5,y:T,width:1.5,height:6,fill:'var(--you)'}):sv('rect',{x:x-.5,y:T+PH-6,width:1.5,height:6,fill:'var(--opp)'}));}
  const sy=T+PH+3;for(let k=0;k<st.length;k++){const s=st[k];if(s==='I')continue;svg.append(sv('rect',{x:tx(k*step),y:sy,width:Math.max(1,tx(step)-tx(0)+.5),height:6,fill:s==='C'?'#5e676d':color[s]||'#5e676d'}));}
  timeAxis(svg,L,R,sy+8,W,maxT);
  const cross=sv('line',{y1:T,y2:T+PH,stroke:'rgba(230,236,234,.4)',visibility:'hidden'});svg.append(cross);
  const name={L:'advantage: you',O:'advantage: opponent',N:'neutral',C:'incomplete attribution',I:'no evidence'};
  svg.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width;if(mx<L||mx>W-R){t.style.display='none';cross.setAttribute('visibility','hidden');return;}const tm=(mx-L)/(W-L-R)*maxT,k=Math.min(vals.length-1,Math.max(0,Math.round(tm/step)));cross.setAttribute('x1',mx);cross.setAttribute('x2',mx);cross.setAttribute('visibility','visible');place(t,box,ev.clientX,ev.clientY,num(tm,2)+' s: '+(vals[k]==null?'':num(vals[k],2)+', ')+name[st[k]||'I']);});
  svg.addEventListener('mouseleave',()=>{t.style.display='none';cross.setAttribute('visibility','hidden');});
  legend(parent,[{name:'Advantage: you',color:'rgba(57,135,229,.8)'},{name:'Advantage: opponent',color:'rgba(217,89,38,.8)'},{name:'Neutral',color:'rgba(138,148,154,.8)'},{name:'Incomplete attribution',color:'#5e676d',dotted:true},{name:'No evidence (empty)',color:'#22282d',hollow:true}]);
}
/** Reach histogram with weapon filter, shaded target window and individual hit strip. */
function reachHistogram(parent){
  const r=D.reach||{values:[],weapons:[],target:3,tolerance:.06};
  const ctl=controls(parent);const weapons=[...new Set(r.weapons||[])].sort();
  const holder=el('div');parent.append(holder);
  function draw(w){holder.replaceChildren();const vals=(r.values||[]).filter((v,i)=>w==='all'||r.weapons[i]===w);
    const LO=2,HI=4,BIN=.05,n=Math.round((HI-LO)/BIN)+2,bins=new Array(n).fill(0);const bin=v=>v<LO?0:v>=HI?n-1:1+Math.floor((v-LO)/BIN+1e-9);for(const v of vals)bins[bin(v)]++;
    const W=900,H=230,L=40,R=12,T=10,B=64,PH=H-T-B;const{box,svg,t}=chartBox(holder,W,H,'Reach histogram in blocks with the target window shaded');
    const max=Math.max(1,...bins),slot=(W-L-R)/n,xOf=v=>v<LO?.5:v>HI?n-.5:1+(v-LO)/BIN,px=v=>L+xOf(v)*slot;
    svg.append(sv('rect',{x:px(r.target-r.tolerance),y:T,width:Math.max(2,px(r.target+r.tolerance)-px(r.target-r.tolerance)),height:PH,fill:'rgba(25,158,112,.18)'}));
    for(const v of[0,max]){const y=T+PH*(1-v/max);svg.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:v?'#2a3036':'#3b434b'}));svgText(svg,L-6,y+4,String(v),{'text-anchor':'end'});}
    bins.forEach((c,i)=>{const mid=i===0?LO-BIN:i===n-1?HI+BIN:LO+(i-.5)*BIN,inWin=Math.abs(mid-r.target)<=r.tolerance+1e-9,h=PH*c/max,x=L+i*slot;
      if(c)svg.append(sv('rect',{x:x+.5,y:T+PH-h,width:Math.max(1,slot-1),height:h,fill:inWin?'var(--good)':'var(--you)'}));
      const lab=i===0?'< 2.00':i===n-1?'≥ 4.00':(LO+(i-1)*BIN).toFixed(2)+'–'+(LO+i*BIN).toFixed(2);const hit=sv('rect',{x,y:T,width:slot,height:PH,fill:'transparent'});hoverTip(hit,t,box,lab+' blocks: '+c+' hit'+(c===1?'':'s')+(inWin?' (in target window)':''));svg.append(hit);});
    svg.append(sv('line',{x1:px(r.target),x2:px(r.target),y1:T,y2:T+PH,stroke:'#e6ecea','stroke-width':1.5}));svgText(svg,px(r.target)+3,T+10,'target '+num(r.target,2),{fill:'#e6ecea'});
    for(let v=LO;v<=HI+1e-9;v+=.25)svgText(svg,px(v),T+PH+14,v.toFixed(2),{'text-anchor':'middle'});
    // individual hits strip
    const sy=T+PH+24;svg.append(sv('line',{x1:L,x2:W-R,y1:sy,y2:sy,stroke:'#2a3036'}));
    vals.forEach((v,i)=>{const c=sv('circle',{cx:px(Math.max(LO-.04,Math.min(HI+.04,v))),cy:sy+((i%3)-1)*4,r:3,fill:Math.abs(v-r.target)<=r.tolerance+1e-9?'var(--good)':'var(--you)',stroke:'#1b2025'});hoverTip(c,t,box,'Hit: '+v.toFixed(3)+' blocks');svg.append(c);});
    svgText(svg,W-R,H-6,'reach in blocks (eye to hitbox contact)',{'text-anchor':'end'});
    if(!vals.length)emptyText(svg,W,H-30,'No eligible confirmed hits for this filter');
    legend(holder,[{name:'In target window ('+num(r.target,2)+' ± '+num(r.tolerance,2)+')',color:'var(--good)'},{name:'Outside window',color:'var(--you)'},{name:'Shaded: target window',color:'rgba(25,158,112,.35)'}]);}
  select(ctl,'Weapon',[['all','All weapons'],...weapons.map(w=>[w,item(w)])],draw);draw('all');
}
/** Weapon timing scatter: interval minus expected cooldown per attempt, filtered. */
function timingChart(parent){
  const all=D.timingSamples||[];const ctl=controls(parent);const holder=el('div');parent.append(holder);
  const weapons=[...new Set(all.map(t=>t.weapon))].sort();let w='all',o='all';
  function draw(){holder.replaceChildren();const pts=all.filter(t=>(w==='all'||t.weapon===w)&&(o==='all'||(o==='hit'?t.outcome==='HIT':t.outcome!=='HIT')));
    const W=900,H=240,L=56,R=12,T=10,B=34,PH=H-T-B;const{box,svg,t}=chartBox(holder,W,H,'Attack interval minus expected cooldown in ticks for each attempt');
    let m=4;for(const p of pts)if(fin(p.delta))m=Math.max(m,Math.abs(p.delta));const range=Math.min(40,Math.ceil(m+1));const tol=F.policy?.timingToleranceTicks??1;
    const tx=v=>L+(W-L-R)*v/dur,ty=v=>T+PH/2-Math.max(-range,Math.min(range,v))/range*(PH/2-4);
    svg.append(sv('rect',{x:L,y:T,width:W-L-R,height:PH,fill:'rgba(34,40,45,.9)'}));
    svg.append(sv('rect',{x:L,y:ty(tol),width:W-L-R,height:Math.max(1,ty(-tol)-ty(tol)),fill:'rgba(25,158,112,.18)'}));
    svg.append(sv('line',{x1:L,x2:W-R,y1:ty(0),y2:ty(0),stroke:'#e6ecea','stroke-opacity':.6}));
    for(const v of[range,0,-range])svgText(svg,L-6,ty(v)+4,(v>0?'+':'')+v+' t',{'text-anchor':'end'});
    svgText(svg,L+4,ty(0)-4,'expected cooldown',{fill:'#9aa6ac'});
    for(const p of pts){const x=tx(p.t);if(p.grade==='OPENER'||!fin(p.delta)){svg.append(sv('line',{x1:x,x2:x,y1:T,y2:T+PH,stroke:'#9aa6ac','stroke-dasharray':'2 3','stroke-opacity':.7}));svgText(svg,x+2,T+PH-4,'reset',{'font-size':9,fill:'#9aa6ac'});const r=sv('rect',{x:x-3,y:T,width:6,height:PH,fill:'transparent'});hoverTip(r,t,box,item(p.weapon)+' · reset / opener (ungraded) · '+cap(p.outcome));svg.append(r);continue;}
      const y=ty(p.delta),c=timingColor[p.grade]||'#8a949a';let n;
      if(p.outcome==='HIT')n=sv('rect',{x:x-3.5,y:y-3.5,width:7,height:7,fill:c});

/** Shared tick-aligned timeline of attributed incoming hits and actual jumps, with zoom. */
function jumpTimeline(parent){
  const att=incoming.filter(i=>i.attributed&&i.tick!=null);const jumps=E.filter(e=>e.kind==='JUMP'&&e.clientTick!=null);
  if(!att.length){note(parent,'No attributed incoming hits with client ticks in this recording.');return;}
  const t0=Math.min(...att.map(i=>i.tick),...jumps.map(j=>j.clientTick)),t1=Math.max(...att.map(i=>i.tick),...jumps.map(j=>j.clientTick));

      const r=sv('rect',{x,y:T+6,width:w,height:LH-12,fill:color[i.jumpClass]||'#8a949a'});hoverTip(r,t,box,'Incoming hit at tick '+(i.tick-t0)+' · '+cap(i.jumpClass)+(i.jumpOffsetTicks!=null?' ('+sgn(i.jumpOffsetTicks,0)+' t)':'')+' · '+(i.ground==null?'movement unknown':(i.ground?'ground':'air')+(i.sprinting?', sprint':''))+(i.knockback!=null?' · knockback '+num(i.knockback,2):''));svg.append(r);}

/** Hitbox face with measured hit coordinates and derived region colors, filterable. */
function aimView(parent){

  if(!all.length){note(parent,'No ray-contact hits with measurement data. Recordings before 0.1.2 have normalized placement only.');return;}
  const ctl=controls(parent);const holder=el('div');parent.append(holder);
  const weapons=[...new Set(all.map(s=>s.weapon))].sort();let w='all',seg='all',sel=null;
  const segOk=s=>seg==='all'||(seg==='1'&&s.t<dur/3)||(seg==='2'&&s.t>=dur/3&&s.t<2*dur/3)||(seg==='3'&&s.t>=2*dur/3);

    if(!list.length){holder.append(el('p',{class:'empty'},'No hits for this filter.'));return;}

    const axes=pick.face==='TOP'||pick.face==='BOTTOM'?[0,2]:pick.face==='EAST'||pick.face==='WEST'?[2,1]:[0,1];const[u,v]=axes;
    const scale=Math.min(360/size[u],300/size[v]),bw=size[u]*scale,bh=size[v]*scale,bx=(W-bw)/2,by=24;
    if(h){const r=h.measurement.idealRegion,ideal=[r.ideal.x,r.ideal.y,r.ideal.z],point=[pick.x,pick.y,pick.z];const cols=30,rows=40;
      for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const n=[...point];n[u]=(x+.5)/cols;n[v]=1-(y+.5)/rows;const d=Math.hypot(...n.map((a,k)=>(a-ideal[k])*size[k]));const k=!r.reachable?'POOR':d<=r.idealRadius?'IDEAL':d<=r.goodRadius?'GOOD':d<=r.peripheralRadius?'PERIPHERAL':'POOR';
        const cell=sv('rect',{x:bx+x*bw/cols,y:by+y*bh/rows,width:bw/cols+.1,height:bh/rows+.1,fill:gradeColor[k],'fill-opacity':.38});hoverTip(cell,t,box,'Derived region: '+cap(k)+' · '+d.toFixed(3)+' blocks from the ideal point');svg.append(cell);}}
    svg.append(sv('rect',{x:bx,y:by,width:bw,height:bh,fill:'none',stroke:'#9aa6ac'}));
    for(const s of faceList){const p=[s.x,s.y,s.z],cx=bx+p[u]*bw,cy=by+(1-p[v])*bh;const c=sv('circle',{cx,cy,r:s.seq===pick.seq?6:4,fill:gradeColor[s.grade]||'#9aa6ac',stroke:s.seq===pick.seq?'#fff':'#111417','stroke-width':s.seq===pick.seq?2:1,tabindex:0,role:'button','aria-label':'Hit at '+num(s.t,2)+' s, '+cap(s.grade)});
      c.addEventListener('click',()=>{sel=s.seq;draw();});c.addEventListener('keydown',e=>{if(e.key==='Enter'){sel=s.seq;draw();}});
      hoverTip(c,t,box,'Measured contact at '+num(s.t,2)+' s ('+item(s.weapon)+', '+s.band+'): '+[s.x,s.y,s.z].map(x=>x.toFixed(2)).join(', ')+' · derived grade '+cap(s.grade)+(fin(s.distance)?' · '+s.distance.toFixed(3)+' blocks from ideal':''));svg.append(c);}
    svgText(svg,W/2,by+bh+22,cap(pick.face)+' face ('+(u===0?'X':'Z')+' across, '+(v===1?'height':'Z')+' up) · '+faceList.length+' hits on this face; selected hit outlined',{'text-anchor':'middle',fill:'#c9d3d9','font-size':13});
    legend(holder,['IDEAL','GOOD','PERIPHERAL','POOR'].map(k=>({name:cap(k)+' (derived)',color:gradeColor[k]})));
    note(holder,'Dots are measured ray intersections (raw normalized coordinates). Background colors are a derived heuristic for the selected hit: the ideal point follows the nearest reachable surface with an edge inset and changes with elevation and pose. Other surface cells do not reconstruct occlusion. Missed swings have no impact point and are not drawn.');}
  select(ctl,'Weapon',[['all','All weapons'],...weapons.map(x=>[x,item(x)])],x=>{w=x;draw();});

  if(dom){const m=dom.model;note(p,'Model: each confirmed hit weighs '+m.hit+' (+'+m.streakBonus+' when it continues a combo); opponent blocks −'+m.shieldBlocked+', shield disables ±'+m.shieldDisabled+', your blocks +'+m.localBlock+'; every input decays with a '+m.tau+' s time constant. D = (you − opponent) / (you + opponent + 1), so thin evidence stays near zero and one event reaches at most 0.5. States: above +'+m.threshold+' you, below −'+m.threshold+' opponent; evidence mass under '+m.minMass+' is "no evidence"; unattributed damage mass of '+m.maxUnattributed+' or more is "incomplete". Accuracy, aim and reach are not inputs. This is combat advantage from observed hits, not physical momentum and not a win probability.');}

timeline(p){
  h2(p,'Playback','recorded event timestamps; no world-state replay');
  const ctl=el('div',{class:'controls'});const play=el('button',{class:'mc','aria-label':'Play'},'Play');const prev=el('button',{class:'mc'},'Prev event');const next=el('button',{class:'mc'},'Next event');
  const speed=el('select',{class:'mc','aria-label':'Playback speed'});for(const s of[.25,.5,1,2,4]){const o=el('option',{value:s},s+'×');if(s===1)o.selected=true;speed.append(o);}

  const W=900,lanes=[['Your attacks',0],['Incoming',1],['Shields',2],['Jumps',3],['Sprint',4]],LH=22,L=112,H=lanes.length*LH+14;

  const marks=[];let sprintOn=null;
  for(const e of E){const x=tx(sec(e));let m=null;const o=outcomes[e.sequence];
    if(e.kind==='ATTACK'){const y=8+LH/2;const h=hitBySeq[e.sequence];m=h?sv('circle',{cx:x,cy:y,r:5,fill:'var(--you)'}):o&&o.startsWith('SHIELD')?sv('path',{d:`M${x} ${y-6}L${x+6} ${y}L${x} ${y+6}L${x-6} ${y}Z`,fill:'var(--good)'}):!isEmpty(e)?sv('circle',{cx:x,cy:y,r:4.5,fill:'none',stroke:'var(--opp)','stroke-width':2}):sv('rect',{x:x-1,y:y-6,width:2,height:12,fill:'#9aa6ac'});m.dataset.k=h?'Correlated hit':o&&o.startsWith('SHIELD')?'Shield block':!isEmpty(e)?'No server report':'Empty swing';}
    else if(e.kind==='DAMAGE_IN'){const att=e.context?.attribution;const attributed=att?att.startsWith('OPPONENT'):!!e.actor;m=attributed?sv('rect',{x:x-4,y:8+LH+LH/2-4,width:8,height:8,fill:'var(--opp)'}):sv('rect',{x:x-4,y:8+LH+LH/2-4,width:8,height:8,fill:'none',stroke:'#9aa6ac','stroke-width':1.5});m.dataset.k=attributed?'Attributed incoming hit':'Unattributed damage';}
    else if(e.kind==='SHIELD'){const y=8+2*LH+LH/2;m=sv('rect',{x:x-3,y:y-5,width:6,height:10,fill:e.context?.shield==='DISABLE'?'var(--warn)':'var(--good)'});m.dataset.k='Shield '+(e.context?.shield||'').toLowerCase()+' ('+(e.context?.subject==='local'?'you':'opponent')+')';}
    else if(e.kind==='CRIT'){const y=e.context?.subject==='local'?8+LH+LH/2:8+LH/2;m=sv('path',{d:`M${x-4} ${y-8}L${x+4} ${y-8}L${x} ${y-3}Z`,fill:'var(--warn)'});m.dataset.k='Server critical hit on '+(e.context?.subject==='local'?'you':'opponent');}
    else if(e.kind==='JUMP'){m=sv('path',{d:`M${x-5} ${8+3*LH+LH/2+4}L${x} ${8+3*LH+LH/2-5}L${x+5} ${8+3*LH+LH/2+4}Z`,fill:'#9aa6ac'});m.dataset.k='Jump';}
    else if(e.kind==='SPRINT'){if(e.detail==='true')sprintOn=sec(e);else if(sprintOn!=null){svg.append(sv('rect',{x:tx(sprintOn),y:8+4*LH+LH/2-3,width:Math.max(1,tx(sec(e))-tx(sprintOn)),height:6,fill:'#6c767c'}));sprintOn=null;}}
    else if(e.kind==='DEATH'){m=sv('rect',{x:x-1,y:8,width:2,height:LH*5,fill:'var(--warn)'});m.dataset.k='Death observed';}
    if(m){m.dataset.t=sec(e);svg.append(m);marks.push(m);}}
  if(sprintOn!=null)svg.append(sv('rect',{x:tx(sprintOn),y:8+4*LH+LH/2-3,width:Math.max(1,tx(dur)-tx(sprintOn)),height:6,fill:'#6c767c'}));
  const head=sv('line',{y1:2,y2:H-4,stroke:'#e4c46e','stroke-width':1.5});svg.append(head);
  svg.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width;let best=null,bd=8;for(const m of marks){const d=Math.abs(tx(+m.dataset.t)-mx);if(d<bd){bd=d;best=m;}}if(best)place(t,box,ev.clientX,ev.clientY,best.dataset.k+' · '+(+best.dataset.t).toFixed(2)+' s');else t.style.display='none';});
  svg.addEventListener('mouseleave',()=>t.style.display='none');
  svg.addEventListener('click',ev=>{const r=svg.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width;setT((mx-L)/(W-L-10)*dur);});
  legend(p,[{name:'Correlated hit',color:'var(--you)'},{name:'No server report',color:'var(--opp)',hollow:true},{name:'Shield block',color:'var(--good)'},{name:'Empty swing',color:'#9aa6ac'},{name:'Attributed incoming',color:'var(--opp)'},{name:'Unattributed damage',color:'#9aa6ac',hollow:true},{name:'Server crit',color:'var(--warn)'}]);
  const now=el('div',{class:'now'});p.append(now);
  const annot=el('div',{class:'annot','aria-live':'polite'});p.append(annot);
  h2(p,'Events up to playhead');
  const fl=el('div',{class:'controls'});const filter=el('select',{class:'mc','aria-label':'Event filter'});for(const k of['All','ATTACK','HURT','DAMAGE_IN','SHIELD','CRIT','JUMP','SPRINT','HEALTH','VELOCITY','DEATH','MOTION'])filter.append(el('option',{value:k},k==='All'?'All events':k));fl.append(filter);p.append(fl);
  const wrap=el('div',{class:'scroll'});const tbl=el('table');const hr=el('tr');for(const h of['Time','Event','Confidence','Details'])hr.append(el('th',null,h));const thd=el('thead');thd.append(hr);tbl.append(thd);const tb=el('tbody');tbl.append(tb);wrap.append(tbl);p.append(wrap);
  const times=E.filter(e=>e.kind!=='MOTION').map(sec);
  let T=0,playing=false,last=0;
  function describe(e){if(!e)return['Start of recording',''];const h=hitBySeq[e.sequence];const o=outcomes[e.sequence];
    if(e.kind==='ATTACK'){if(h)return['Correlated hit',m2(h.reach)+(h.contact?' ray contact':' nearest box')+' · '+(h.measurement?.timing?cap(h.measurement.timing.grade)+' attempt timing':'Timing unavailable')+' · combo '+h.combo+(h.serverCrit?' · server crit':h.critical?' · crit conditions':'')+(h.sprinting?' · sprinting':'')];if(o&&o.startsWith('SHIELD'))return['Shield '+(o==='SHIELD_DISABLE'?'disabled':'block'),'The opponent\'s shield blocked this attack; no damage event.'];if(!isEmpty(e))return['Attack without server report','Estimated distance '+m2(e.attack.reach)+'. Uncertain, not a proven miss.'];return['Empty swing','No entity selected. Confirmed miss.'+(e.attack?' Distance to the recent opponent '+m2(e.attack.reach)+'.':'')];}
    if(e.kind==='HURT')return['Server damage report','Local melee source; amount unavailable.'];
    if(e.kind==='DAMAGE_IN'){const a=e.context?.attribution;return[a&&!a.startsWith('OPPONENT')?'Unattributed damage':'Incoming hit',a?attrName[a]||a:'Server damage event'];}
    if(e.kind==='SHIELD')return['Shield '+(e.context?.shield||'').toLowerCase(),'At '+(e.context?.subject==='local'?'you':'the opponent')];
    if(e.kind==='CRIT')return['Server critical hit','On '+(e.context?.subject==='local'?'you':'the opponent')];
    if(e.kind==='JUMP')return['Jump',e.detail||''];if(e.kind==='SPRINT')return[e.detail==='true'?'Sprint started':'Sprint stopped',''];
    if(e.kind==='DEATH')return['Death observed',e.detail||''];if(e.kind==='DISCONNECT')return['Disconnected',e.detail||''];return[cap(e.kind),e.detail||''];}
  function detailText(e){const h=hitBySeq[e.sequence];if(e.attack)return(h?'Hit · ':'')+'Cooldown '+e.attack.cooldown.toFixed(2)+' · Reach '+e.attack.reach.toFixed(2)+' m'+(e.attack.rayContact?' · Aim '+[e.attack.aimX,e.attack.aimY,e.attack.aimZ].map(v=>v.toFixed(2)).join(', '):' · no ray contact');const c=e.context;if(c){if(e.kind==='HEALTH')return'Health '+num(c.health,1)+(c.absorption?' + '+num(c.absorption,1):'');if(e.kind==='VELOCITY')return'Velocity '+[c.vx,c.vy,c.vz].map(v=>num(v,3)).join(', ');if(e.kind==='DAMAGE_IN')return(attrName[c.attribution]||'')+(c.damageType?' · '+item(c.damageType):'');}return e.detail||'';}
  function render(){const k=filter.value;seek.value=Math.round(1000*T/dur);clock.textContent=T.toFixed(2)+' / '+dur.toFixed(2)+' s';head.setAttribute('x1',tx(T));head.setAttribute('x2',tx(T));
    const upTo=E.filter(e=>sec(e)<=T+1e-9);const shown=upTo.filter(e=>k==='All'?e.kind!=='MOTION':e.kind===k);
    tb.replaceChildren();for(const e of shown.slice(-200)){const r=el('tr');for(const c of[sec(e).toFixed(3),e.kind,cap(e.confidence),detailText(e)])r.append(el('td',null,c));tb.append(r);}if(tb.lastChild)tb.lastChild.className='cur';wrap.scrollTop=wrap.scrollHeight;
    const lastEv=[...upTo].reverse().find(e=>e.kind!=='MOTION');const[a,b]=describe(lastEv);annot.replaceChildren(el('b',null,a),document.createTextNode(b?' — '+b:''));
    const hs=hits.filter(h=>h.t<=T),at=upTo.filter(e=>e.kind==='ATTACK').length,inc=(D.incoming||[]).filter(x=>x<=T).length;const k2=dom?Math.min((dom.values||[]).length-1,Math.max(0,Math.round(T/dom.step))):-1;const dv=dom&&k2>=0?dom.values[k2]:null;
    const cur=(combos.marks||[]).filter(m=>m.t<=T);let run=0;for(let i=cur.length-1;i>=0&&cur[i].side==='LOCAL'&&!cur[i].traded;i--)run++;
    now.replaceChildren(card('Hits so far',String(hs.length),at+' attempts'),card('Attributed incoming',String(inc),'opponent hits'),card('Current streak',String(run),'your unanswered hits'),card('Dominance',dv==null?NONE:num(dv,2),dom?{L:'you',O:'opponent',N:'neutral',C:'incomplete',I:'no evidence'}[(dom.states||'')[k2]]||'':'unavailable','dominance'));
    for(const m of marks)m.setAttribute('opacity',+m.dataset.t<=T?1:.35);}
  function setT(v){T=Math.max(0,Math.min(dur,v));render();}
  function frame(ts){if(!playing)return;if(last)setT(T+(ts-last)/1000*Number(speed.value));last=ts;if(T>=dur){toggle(false);return;}requestAnimationFrame(frame);}
  function toggle(on){playing=on;play.textContent=on?'Pause':'Play';play.setAttribute('aria-label',on?'Pause':'Play');last=0;if(on){if(T>=dur)T=0;requestAnimationFrame(frame);}}
  play.onclick=()=>toggle(!playing);
  next.onclick=()=>{const n=times.find(x=>x>T+1e-6);setT(n!=null?n:dur);};
  prev.onclick=()=>{const c=[...times].reverse().find(x=>x<T-1e-6);setT(c!=null?c:0);};
  seek.oninput=()=>setT(Number(seek.value)/1000*dur);filter.onchange=render;
  document.addEventListener('keydown',e=>{if(!$('p-timeline').classList.contains('on')||e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key===' '){e.preventDefault();toggle(!playing);}else if(e.key==='.')next.click();else if(e.key===',')prev.click();});

  note(p,'Playback advances through the recorded timestamps at the chosen speed. It annotates what KWAMSTER observed; it does not reconstruct positions or the Minecraft world. Space plays or pauses; comma and period step between events.');
