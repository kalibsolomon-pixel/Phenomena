<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>KWAMSTER Fight Report</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111417;--surface:#1b2025;--surface-2:#22282d;--hover:#2c3338;--pressed:#16191c;
  --border:#3b434b;--border-soft:#2c3238;--grid:#2a3036;
  --text:#e6ecea;--muted:#9aa6ac;--dim:#6c767c;
  --accent:#88c8aa;--warn:#e4c46e;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--seq:#86b6ef;
  --mono:"Minecraft","Minecraftia","Monocraft",ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 var(--mono);letter-spacing:.01em}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 48px}
header.top{background:#15191c;border-bottom:1px solid var(--border-soft)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;color:var(--accent)}
.sub{color:var(--dim)}
.badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.badge{border:1px solid var(--border);padding:1px 7px;color:var(--muted);font-size:12px}
.ident{padding:16px 0 4px}
.ident h1{font-size:18px;margin:0 0 4px;font-weight:700}
.ident p{margin:0;color:var(--muted)}
nav.tabs{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--border-soft);overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--text)}
nav.tabs button[aria-selected=true]{background:var(--surface);color:var(--text);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
main.panel{background:var(--surface);border:1px solid var(--border-soft);border-top:0;padding:16px}
section[role=tabpanel]{display:none}
section[role=tabpanel].on{display:block}
h2{font-size:14px;font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
h2:first-child{margin-top:4px}
h2::after{content:"";flex:1;height:1px;background:var(--border-soft)}
h2 small{color:var(--dim);font-weight:400;order:2}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.card{background:var(--surface-2);padding:8px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.card .l{color:var(--muted);font-size:12px}
.card .v{font-size:19px;font-weight:700;margin:2px 0}
.card .v.none{color:var(--dim)}
.card .c{color:var(--dim);font-size:11px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 6px;align-items:baseline}
.tag{display:inline-block;font-size:10px;border:1px solid var(--border);color:var(--dim);padding:0 4px;white-space:nowrap;margin-left:auto}
.note{background:rgba(34,40,45,.6);border-left:2px solid var(--border);padding:8px 12px;color:var(--muted);margin:10px 0}
.note.warn{border-left-color:var(--warn)}
p.muted{color:var(--muted);margin:6px 0}
button.mc,select.mc{background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:5px 12px;font:inherit;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.25)}
button.mc:hover,select.mc:hover{background:var(--hover)}
button.mc:active{background:var(--pressed);box-shadow:none}
button.mc[aria-pressed=true]{border-color:var(--accent)}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.controls output{color:var(--muted);min-width:120px}
input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.chart{position:relative;background:rgba(34,40,45,.55);margin:4px 0}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:4px 0 2px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
.legend i.hollow{background:transparent!important;border:2px solid}
.tip{position:absolute;pointer-events:none;background:#0d0f11;border:1px solid var(--border);padding:3px 7px;font-size:12px;white-space:nowrap;display:none;z-index:2}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--border-soft)}
th{color:var(--dim);font-weight:400;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right}
tr.cur td{background:var(--hover)}
.scroll{max-height:360px;overflow:auto;border:1px solid var(--border-soft)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:8px 0}
.annot{background:var(--surface-2);border-left:2px solid var(--accent);padding:8px 12px;min-height:38px}
.annot b{font-weight:700}
footer{color:var(--dim);font-size:12px;padding-top:14px}
@media (max-width:720px){.split{grid-template-columns:1fr}.badges{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.reduced *{transition:none!important}
</style>
</head>

<script>
'use strict';
(function(){
const P=JSON.parse(document.getElementById('data').textContent);
const F=P.fight, D=P.derived, S=D.summary, E=F.events||[];
const base=E.length?E[0].nanoTime:0, dur=Math.max(S.duration||0,.001);
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
if(P.reducedMotion)document.documentElement.classList.add('reduced');
const METRIC={};for(const m of P.metrics||[])METRIC[m.key]=m;

// ---- formatting (mirrors analytics.Format) ----
const NONE='—';
const fin=v=>typeof v==='number'&&isFinite(v);
const pct=v=>fin(v)?v.toFixed(1)+'%':NONE;
const m2=v=>fin(v)?v.toFixed(2)+' m':NONE;
const s2=v=>fin(v)?v.toFixed(2)+' s':NONE;
const num=(v,d)=>fin(v)?v.toFixed(d):NONE;
const sec=e=>(e.nanoTime-base)/1e9;
const isEmpty=e=>!e.attack||(e.detail||'').startsWith('empty-swing');
const cap=s=>s?s.charAt(0)+s.slice(1).toLowerCase():'';
function el(tag,attrs,text){const n=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')n.className=attrs[k];else n.setAttribute(k,attrs[k]);}if(text!=null)n.textContent=String(text);return n;}
function sv(tag,attrs){const n=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)n.setAttribute(k,attrs[k]);return n;}
function h2(parent,text,small){const h=el('h2',null,text);if(small)h.append(el('small',null,small));parent.append(h);return h;}
function note(parent,text,warn){parent.append(el('div',{class:'note'+(warn?' warn':'')},text));}
function card(label,value,caption,key){const c=el('div',{class:'card'});const d=key&&METRIC[key];const cap0=el('div',{class:'c'});cap0.append(el('span',null,caption||''));if(d){cap0.append(el('span',{class:'tag'},d.confidence));c.title=d.confidence+': '+d.help;}c.append(el('div',{class:'l'},label),el('div',{class:'v'+(value===NONE?' none':'')},value),cap0);return c;}
function cards(parent,list){const g=el('div',{class:'cards'});for(const x of list)g.append(card(...x));parent.append(g);}
function label(key,fallback){return METRIC[key]?METRIC[key].label:fallback;}

// ---- header ----
const opp=P.opponentLabel||(P.anonymized?'Opponent':'Opponent');
$('title').textContent='Fight vs '+opp;
$('subtitle').textContent='Outcome '+cap(F.outcome)+' · '+new Date(F.startEpochMillis).toLocaleString()+' · '+num(dur,1)+' s, '+E.length+' events · ended: '+(F.reason||'unknown');
for(const b of ['Offline',P.anonymized?'Anonymized':'Not anonymized',P.motionIncluded?'Motion included':'Motion omitted','Report v'+P.version])$('badges').append(el('span',{class:'badge'},b));

// ---- tabs (hash routed, arrow-key navigation) ----
const TABS=[['summary','Summary'],['timeline','Timeline'],['reach','Reach'],['aim','Aim'],['timing','Timing'],['movement','Movement']];
const built={};
for(const[id,name]of TABS){const b=el('button',{role:'tab',id:'t-'+id,'aria-controls':'p-'+id,'aria-selected':'false',tabindex:'-1'},name);b.onclick=()=>show(id,true);$('tabs').append(b);}
$('tabs').addEventListener('keydown',e=>{const i=TABS.findIndex(t=>$('t-'+t[0]).getAttribute('aria-selected')==='true');let j=i;if(e.key==='ArrowRight')j=(i+1)%TABS.length;else if(e.key==='ArrowLeft')j=(i+TABS.length-1)%TABS.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=TABS.length-1;else return;e.preventDefault();show(TABS[j][0],true);$('t-'+TABS[j][0]).focus();});
function show(id,push){if(!TABS.some(t=>t[0]===id))id='summary';for(const[t]of TABS){const on=t===id;$('t-'+t).setAttribute('aria-selected',on);$('t-'+t).tabIndex=on?0:-1;$('p-'+t).classList.toggle('on',on);}if(!built[id]){built[id]=true;BUILD[id]($('p-'+id));}if(push&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id);}catch(e){}}}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

// ---- charts ----
function tip(box){const t=el('div',{class:'tip'});box.append(t);return t;}
function place(t,box,x,y,text){t.textContent=text;t.style.display='block';const r=box.getBoundingClientRect();let left=x-r.left+12;if(left+t.offsetWidth>r.width)left=x-r.left-t.offsetWidth-12;t.style.left=Math.max(0,left)+'px';t.style.top=Math.max(0,y-r.top-28)+'px';}
function legend(parent,items){if(items.length<2)return;const l=el('div',{class:'legend'});for(const it of items){const s=el('span');const i=el('i',it.hollow?{class:'hollow'}:null);if(it.hollow)i.style.borderColor=it.color;else i.style.background=it.color;s.append(i,document.createTextNode(it.name));l.append(s);}parent.append(l);}
function niceCeil(v){if(!(v>0))return 1;const m=Math.pow(10,Math.floor(Math.log10(v)));for(const k of[1,1.5,2,2.5,3,4,5,6,8,10])if(k*m>=v)return k*m;return 10*m;}
function yfmt(v,unit){return unit==='%'?v.toFixed(0)+'%':unit==='m'?v.toFixed(1)+' m':unit==='s'?v.toFixed(2)+' s':Math.abs(v)<10&&v%1?v.toFixed(1):v.toFixed(0);}
function vfmt(v,unit){return unit==='%'?pct(v):unit==='m'?m2(v):unit==='s'?s2(v):num(v,2);}
/** series: {name,xs?,ys,color,mark:'line'|'points'|'hollow'}; NaN/null are gaps. */
function lineChart(parent,o){
  const W=900,H=o.h||200,L=56,R=12,T=10,B=26;const box=el('div',{class:'chart'});const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':o.aria||o.series.map(s=>s.name).join(', ')});box.append(svg);parent.append(box);
  let lo=Infinity,hi=-Infinity,xl=Infinity,xh=-Infinity;for(const s of o.series)s.ys.forEach((v,i)=>{if(!fin(v))return;lo=Math.min(lo,v);hi=Math.max(hi,v);const x=s.xs?s.xs[i]:i;xl=Math.min(xl,x);xh=Math.max(xh,x);});
  const any=isFinite(lo);const y0=fin(o.yMin)?o.yMin:(any?Math.min(0,lo):0);let y1=fin(o.yMax)?o.yMax:(any?niceCeil(hi):1);if(y1<=y0)y1=y0+1;
  const x0=any?Math.min(0,xl):0;let x1=any?Math.max(xh,1):1;if(fin(o.xMax))x1=o.xMax;if(x1<=x0)x1=x0+1;
  const px=x=>L+(W-L-R)*(x-x0)/(x1-x0),py=v=>T+(H-T-B)*(1-(Math.max(y0,Math.min(y1,v))-y0)/(y1-y0));
  for(const v of[y0,(y0+y1)/2,y1]){const y=py(v);svg.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:v===y0?'#3b434b':'#2a3036'}));const t=sv('text',{x:L-6,y:y+4,'text-anchor':'end',fill:'#6c767c','font-size':11});t.textContent=yfmt(v,o.unit);svg.append(t);}
  if(y0<0&&y1>0){const z=py(0);svg.append(sv('line',{x1:L,x2:W-R,y1:z,y2:z,stroke:'#3b434b'}));}
  const xa=sv('text',{x:(L+W-R)/2,y:H-6,'text-anchor':'middle',fill:'#6c767c','font-size':11});xa.textContent=o.xLabel||'';svg.append(xa);
  for(const[v,anchor]of[[x0,'start'],[x1,'end']]){const t=sv('text',{x:px(v),y:H-6,'text-anchor':anchor,fill:'#6c767c','font-size':11});t.textContent=o.xFmt?o.xFmt(v):num(v,o.xDec??0);svg.append(t);}
  if(!any){const t=sv('text',{x:(L+W)/2,y:H/2,'text-anchor':'middle',fill:'#9aa6ac','font-size':13});t.textContent=o.empty||'No samples';svg.append(t);legend(parent,o.series.map(s=>({name:s.name,color:s.color,hollow:s.mark==='hollow'})));return;}
  const pts=[];
  for(const s of o.series){let d='';let pen=false;s.ys.forEach((v,i)=>{if(!fin(v)){pen=false;return;}const x=px(s.xs?s.xs[i]:i),y=py(v);pts.push({x,y,s,i,v});if(s.mark==='line'){d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);pen=true;}});
    if(s.mark==='line'){svg.append(sv('path',{d,fill:'none',stroke:s.color,'stroke-width':2,'stroke-linejoin':'round'}));if(o.points!==false&&s.ys.length<=120)for(const p of pts.filter(p=>p.s===s))svg.append(sv('circle',{cx:p.x,cy:p.y,r:3,fill:s.color,stroke:'#1b2025','stroke-width':1.5}));}
    else for(const p of pts.filter(p=>p.s===s))svg.append(s.mark==='hollow'?sv('circle',{cx:p.x,cy:p.y,r:4,fill:'none',stroke:s.color,'stroke-width':2}):sv('circle',{cx:p.x,cy:p.y,r:4,fill:s.color,stroke:'#1b2025','stroke-width':1.5}));}
  const cross=sv('line',{y1:T,y2:H-B,stroke:'rgba(230,236,234,.35)',visibility:'hidden'});svg.append(cross);const ring=sv('circle',{r:6,fill:'none',stroke:'#e6ecea','stroke-width':1.5,visibility:'hidden'});svg.append(ring);
  const t=tip(box);
  svg.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width,my=(ev.clientY-r.top)*H/r.height;let best=null,bd=40;for(const p of pts){const d=Math.abs(p.x-mx)+(p.s.mark==='line'?0:Math.abs(p.y-my)*.5);if(d<bd){bd=d;best=p;}}if(!best){cross.setAttribute('visibility','hidden');ring.setAttribute('visibility','hidden');t.style.display='none';return;}cross.setAttribute('x1',best.x);cross.setAttribute('x2',best.x);cross.setAttribute('visibility','visible');ring.setAttribute('cx',best.x);ring.setAttribute('cy',best.y);ring.setAttribute('visibility','visible');const xv=best.s.xs?best.s.xs[best.i]:best.i;place(t,box,ev.clientX,ev.clientY,best.s.name+' · '+(o.xFmt?o.xFmt(xv):(o.xLabel||'#')+' '+num(xv,o.xDec??0))+': '+vfmt(best.v,o.unit));});
  svg.addEventListener('mouseleave',()=>{cross.setAttribute('visibility','hidden');ring.setAttribute('visibility','hidden');t.style.display='none';});

function bars(parent,o){

  const n=o.labels.length,g=o.groups.length;let max=0;for(const gr of o.groups)for(const v of gr.values)max=Math.max(max,v);

  const j=D.jumps||[];const bins=10,cand=new Array(bins).fill(0),other=new Array(bins).fill(0);for(const x of j){const b=Math.max(0,Math.min(bins-1,Math.floor(x.offsetMs/100)));(x.candidate?cand:other)[b]++;}
  h2(p,'Jump timing after incoming damage','100 ms bins');
  bars(p,{labels:cand.map((_,i)=>String(i*100)),groups:[{name:'Candidate',values:cand,color:'var(--s1)'},{name:'Outside window',values:other,color:'var(--s2)'}],empty:'No jumps within 1 s after incoming damage'});
  note(p,'Jump-reset success is unavailable. Candidates are observed jumps shortly after incoming damage; whether knockback was reduced needs a validated baseline that does not exist yet.',true);
  h2(p,'Combo progression');
  lineChart(p,{series:[{name:'Combo',xs:hits.map(h=>h.t),ys:hits.map(h=>h.combo),color:'var(--s1)',mark:'line'}],yMin:0,unit:'',xLabel:'s',xDec:1,xMax:dur,empty:'No correlated hits'});
  h2(p,'Estimated momentum','illustrative, not win probability');
  const mo=D.momentum||[];lineChart(p,{series:[{name:'Momentum (estimate)',xs:mo.map(m=>m[0]),ys:mo.map(m=>m[1]),color:'var(--s1)',mark:'line'}],yMin:-1,yMax:1,unit:'',xLabel:'s',xDec:1,xMax:dur,points:false,empty:'No exchanges'});
  note(p,(METRIC.momentum?METRIC.momentum.help:'')+' Shown for orientation only.',true);
}};
show(location.hash.slice(1)||'summary');
})();
