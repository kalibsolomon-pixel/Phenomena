<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="generator" content="Phenomena">
<title>Phenomena Fight Report</title>
<style>
/* Spxctra tokens, mirrored from dev.phenomena.gui.theme.Theme (named by role, not value). */
:root{
  color-scheme:dark;
  --bg:#101316;--header:#141920;--surface:#171c21;--surface-2:#1d2329;--hover:#262d34;--pressed:#12161a;--inset:#12161a;
  --border:#39424b;--border-soft:#2a3138;--grid:#252c33;
  --text:#e8edeb;--muted:#9ba7ad;--dim:#7a848b;
  --accent:#88c8aa;--warn:#e4c46e;--error:#e49790;
  --you:#3987e5;--opp:#d95926;--good:#199e70;
  --radius:4px;--radius-sm:3px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --ease:120ms cubic-bezier(.2,0,0,1);
  --gutter:24px;--tabs-h:46px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--gutter)}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:8px;top:8px;z-index:10;background:var(--surface-2);color:var(--text);padding:6px 10px;border-radius:var(--radius)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App bar: the same quiet wordmark row as the native dashboard. */
.appbar{background:var(--header);border-bottom:1px solid var(--border-soft)}
.appbar .wrap{display:flex;align-items:baseline;gap:12px;min-height:48px;padding-top:11px;padding-bottom:11px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--accent)}
.appbar .sub{color:var(--muted)}
.appbar .status{margin-left:auto;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.appbar .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}

/* Report header: the result first, then who, where and when. One static tonal band, no effects. */
.hero{background:linear-gradient(180deg,var(--header) 0%,var(--bg) 100%);padding:22px 0 18px}
.result-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.result{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;padding:3px 10px;border-radius:var(--radius);border:1px solid currentColor;line-height:1.3}
.result::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.result.win{color:var(--accent)}.result.loss{color:var(--error)}.result.interrupted{color:var(--warn)}.result.neutral{color:var(--muted)}
.result-detail{color:var(--muted);font-size:14px}
h1{font-size:26px;line-height:1.25;font-weight:700;margin:4px 0 14px;overflow-wrap:anywhere}
dl.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 24px;margin:0}
dl.meta div{min-width:0}
dl.meta dt{color:var(--dim);font-size:12px;margin:0}
dl.meta dd{margin:1px 0 0;font-size:14px;overflow-wrap:anywhere}
.coverage{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.coverage li{color:var(--muted);font-size:13px;padding-left:14px;position:relative;max-width:90ch}
.coverage li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:1px;background:var(--warn)}

/* Manual session scope. */
.scope{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin:0 0 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius)}
.scope:empty{display:none}
.scope .lead{color:var(--muted);font-size:13px;margin-right:2px}

/* Tabs: flat at rest, accent underline when selected; sticky so navigation stays in reach. */
.tabs-bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border-soft)}
nav.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;min-height:var(--tabs-h);background:transparent;border:0;color:var(--muted);padding:0 18px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap;position:relative;transition:color var(--ease),background-color var(--ease)}
nav.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:2px 2px 0 0;background:transparent;transition:background-color var(--ease)}
nav.tabs button:hover{color:var(--text);background:var(--surface)}
nav.tabs button[aria-selected=true]{color:var(--text);font-weight:600}
nav.tabs button[aria-selected=true]::after{background:var(--accent)}
nav.tabs button:focus-visible{outline-offset:-2px}

main.panel{padding:18px 0 8px;min-width:0}
section[role=tabpanel]{display:none}
section[role=tabpanel].on{display:block}
section[role=tabpanel]:focus{outline:none}

/* Section chips (jump links) as in the native sub-navigation. */
nav.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
nav.chips a{color:var(--muted);border:1px solid var(--border);border-radius:14px;padding:3px 12px;text-decoration:none;font-size:13px;line-height:20px;transition:color var(--ease),background-color var(--ease),border-color var(--ease)}
nav.chips a:hover{color:var(--text);background:var(--surface-2)}
nav.chips a[aria-current=true]{color:var(--text);border-color:var(--accent);background:rgba(136,200,170,.08)}

h2{font-size:17px;font-weight:600;margin:30px 0 10px;display:flex;align-items:baseline;gap:12px;scroll-margin-top:calc(var(--tabs-h) + 14px)}
h2::after{content:"";flex:1;height:1px;background:var(--border-soft);align-self:center;min-width:16px}
h2 small{color:var(--dim);font-weight:400;font-size:13px;order:2;text-align:right}
.chips+h2,section>h2:first-child{margin-top:12px}
h3{font-size:14px;margin:18px 0 6px;color:var(--muted);font-weight:600}
p{margin:6px 0}
p.muted{color:var(--muted);max-width:90ch}

/* Metric cards: label, value with unit, caption, and the measurement's confidence in words. */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px;margin:8px 0}
.card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
@supports (grid-template-rows:subgrid){.cards .card{display:grid;grid-row:span 3;grid-template-rows:subgrid;gap:2px;align-content:start}.cards .card .foot{align-self:end}}
.card .top{display:flex;align-items:flex-start;gap:6px}
.card .l{color:var(--muted);font-size:13px;line-height:1.35;flex:1;min-width:0}
.card .v{font-size:22px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.card .v .u{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.card .v.none{color:var(--dim);font-weight:600}
.card .v.text{font-size:16px}
.card .foot{margin-top:auto;min-width:0}
.card .c{color:var(--dim);font-size:12.5px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding-top:2px}
.card .c span:first-child{flex:1 1 auto;min-width:0}
.conf{font-size:12px;line-height:17px;border:1px solid var(--border);color:var(--muted);padding:0 5px;border-radius:var(--radius-sm);max-width:100%;overflow-wrap:anywhere}
.conf.confirmed{color:var(--accent);border-color:rgba(136,200,170,.55)}
.conf.inferred{border-style:dashed}
.conf.estimated{color:var(--warn);border-color:rgba(228,196,110,.5)}
button.info{flex:none;width:22px;height:22px;margin:-2px -4px 0 0;border:1px solid transparent;border-radius:var(--radius-sm);background:transparent;color:var(--dim);font:600 12px/1 var(--sans);cursor:pointer;padding:0}
button.info:hover{color:var(--text);background:var(--hover)}
button.info[aria-expanded=true]{color:var(--text);border-color:var(--border)}
.card .def{margin:6px 0 0;padding-top:6px;border-top:1px solid var(--border-soft);color:var(--muted);font-size:12.5px;line-height:1.45}

/* Compact secondary statistics: one row each, lighter than cards. */
dl.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 24px;margin:6px 0 10px}
dl.kv div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:6px 0;border-bottom:1px solid var(--border-soft);align-items:baseline}
dl.kv dt{color:var(--muted);font-size:13.5px;margin:0}
dl.kv dd{margin:0;font-weight:600;text-align:right}
dl.kv dd.none{color:var(--dim)}
dl.kv small{grid-column:1/-1;color:var(--dim);font-size:12px}

/* Notes: visible callouts for caveats, collapsible blocks for methodology. */
.note{background:var(--surface);border-left:2px solid var(--border);border-radius:0 var(--radius) var(--radius) 0;padding:9px 13px;color:var(--muted);margin:10px 0;font-size:14px;max-width:110ch}
.note.warn{border-left-color:var(--warn)}
details{margin:10px 0}
details>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px;width:max-content;max-width:100%}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform var(--ease);margin:0 3px 0 1px;flex:none}
details[open]>summary::before{transform:rotate(45deg)}
details>summary:hover{color:var(--text)}
details>summary .count{color:var(--dim)}
details.method>div{color:var(--muted);font-size:14px;max-width:110ch;padding:2px 0 4px 18px}
details.method p{margin:0 0 6px}
ul.facts{margin:6px 0 0;padding-left:20px;max-width:100ch}
ul.facts li{margin:4px 0}

/* Controls. */
button.btn,select{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);min-height:34px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;max-width:100%;transition:background-color var(--ease)}
select{padding-right:8px}
button.btn:hover,select:hover{background:var(--hover)}
button.btn:active{background:var(--pressed)}
button.btn.primary{border-color:rgba(136,200,170,.6)}
.controls{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin:8px 0 10px}
.controls label{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;min-width:0}
.controls .pair{display:inline-flex;gap:8px}
.controls output{color:var(--muted);font-size:14px;min-width:118px}
input[type=range]{flex:1 1 160px;min-width:120px;accent-color:var(--accent);height:28px;margin:0}

/* Charts are drawn at their real pixel width, so text stays at its stated size. */
.chart{position:relative;margin:6px 0;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--sans)}
.legend{display:flex;gap:4px 16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;flex:none}
.legend i.hollow{background:transparent!important;border:2px solid}
.legend i.dotted{background:repeating-linear-gradient(45deg,#5e676d 0 2px,transparent 2px 4px)!important}
.tip{position:absolute;pointer-events:none;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 14px rgba(0,0,0,.35);padding:5px 9px;font-size:13px;line-height:1.4;display:none;z-index:4;max-width:min(360px,calc(100% - 8px));white-space:normal;color:var(--text)}
.bar{display:flex;height:14px;border-radius:var(--radius-sm);overflow:hidden;background:var(--inset);margin:8px 0 2px}
.bar span{display:block;height:100%;min-width:2px}
.bar span+span{border-left:2px solid var(--surface)}
.empty{color:var(--muted);padding:18px;text-align:center;background:var(--inset);border-radius:var(--radius);margin:6px 0}

/* Tables scroll inside their own frame, never the page. */
.scroll{max-height:380px;overflow:auto;border:1px solid var(--border-soft);border-radius:var(--radius);margin:6px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}
tbody tr:hover td{background:rgba(38,45,52,.55)}
tr.cur td,tr.sel td{background:var(--hover)}
tr.sel td:first-child,tr.cur td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.ink-win{color:var(--accent)}.ink-loss{color:var(--error)}.ink-warn{color:var(--warn)}.ink-dim{color:var(--dim)}

.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.now .card .v{font-size:19px}
.annot{background:var(--surface);border-left:2px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:9px 13px;min-height:42px;font-size:14px}
.annot b{font-weight:600}
svg [tabindex]{cursor:pointer}
svg [tabindex]:focus{outline:none}
svg [tabindex]:focus-visible{stroke:var(--accent);stroke-width:2}
footer{color:var(--dim);font-size:13px;padding:22px 0 40px;border-top:1px solid var(--border-soft);margin-top:30px}
footer p{margin:2px 0}

@media (max-width:820px){
  :root{--gutter:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  h1{font-size:22px}
}
@media (max-width:520px){
  body{font-size:14.5px}
  .card{padding:9px 10px}
  .card .v{font-size:20px}
  dl.meta{grid-template-columns:1fr 1fr}
  dl.kv{grid-template-columns:1fr}
  .controls label{flex-wrap:wrap}
  .controls select{flex:1 1 auto}
  h2{flex-wrap:wrap;row-gap:0}
  h2::after{display:none}
  h2 small{order:3;flex-basis:100%;text-align:left}
  table{width:max-content;min-width:100%}
  td{max-width:240px}
  .tabs-bar .wrap{padding:0}
  nav.tabs button{padding:0 9px;font-size:14px}
  nav.tabs button::after{left:6px;right:6px}
}
@media (max-width:380px){nav.tabs{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}}
@media (min-width:1600px){.wrap{max-width:1320px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
.reduced *,.reduced *::before,.reduced *::after{transition:none!important}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f4f6f6;--inset:#eef1f1;--text:#111;--muted:#444;--dim:#666;--border:#bbb;--border-soft:#ddd;--header:#fff}
  .tabs-bar,nav.chips,.controls,button.info,.skip,.scope{display:none!important}
  .hero{background:none}
  .scroll{max-height:none;overflow:visible}
}
</style>

// ---- tooltips: pointer, touch and keyboard focus ----
function tip(box){const t=el('div',{class:'tip'});box.append(t);return t;}
function place(t,box,x,y,text){t.textContent=text;t.style.display='block';const r=box.getBoundingClientRect();let left=x-r.left+12;if(left+t.offsetWidth>r.width)left=Math.max(0,x-r.left-t.offsetWidth-12);t.style.left=Math.max(0,Math.min(left,r.width-t.offsetWidth))+'px';let top=y-r.top-t.offsetHeight-10;if(top<0)top=y-r.top+16;t.style.top=top+'px';}
function hoverTip(node,t,box,text){const show=ev=>place(t,box,ev.clientX,ev.clientY,typeof text==='function'?text():text);
  node.addEventListener('pointermove',show);node.addEventListener('pointerdown',show);node.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse')t.style.display='none';});
  if(node.hasAttribute('tabindex')){node.addEventListener('focus',()=>{const b=node.getBoundingClientRect();place(t,box,b.left+b.width/2,b.top,typeof text==='function'?text():text);});node.addEventListener('blur',()=>t.style.display='none');}}
function legend(parent,items){const l=el('div',{class:'legend'});for(const it of items){const s=el('span');const i=el('i',it.hollow?{class:'hollow'}:it.dotted?{class:'dotted'}:null);if(it.hollow)i.style.borderColor=it.color;else i.style.background=it.color;s.append(i,document.createTextNode(it.name));l.append(s);}parent.append(l);return l;}
function chartBox(parent,W,H,aria){const box=el('div',{class:'chart'});const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:'img','aria-label':aria});box.append(svg);parent.append(box);const t=tip(box);svg.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse')t.style.display='none';});return{box,svg,t};}
function emptyText(svg,W,H,text){svgText(svg,W/2,H/2+4,text,{'text-anchor':'middle',fill:C.muted,'font-size':13});}
function laneBg(svg,x,y,w,h){svg.append(sv('rect',{x,y,width:w,height:h,rx:3,fill:C.lane}));}

let renderAbort,rebuildTab=null;
function render(P,scopeTitle){
if(renderAbort)renderAbort.abort();
renderAbort=new AbortController();const signal=renderAbort.signal;
for(const id of['tabs','meta','coverage','result-line','facts','p-overview','p-offense','p-defense','p-flow','p-timeline'])$(id).replaceChildren();
const F=P.fight, D=P.derived, S=D.summary, E=F.events||[];
const base=F.matchEvidence?.timelineStartNanos??(E.length?E[0].nanoTime:0), dur=Math.max(S.duration||0,.001);
const METRIC={};for(const m of P.metrics||[])METRIC[m.key]=m;
const V3=!!S.contextAvailable;
const sec=e=>(e.nanoTime-base)/1e9;
const isEmpty=e=>!e.attack||(e.detail||'').startsWith('empty-swing');

// ---- building blocks ----
function h2(parent,text,small,id){const h=el('h2',id?{id}:null,text);if(small)h.append(el('small',null,small));parent.append(h);return h;}
function h3Text(parent,text){parent.append(el('h3',null,text));}
function note(parent,text,warn){parent.append(el('div',{class:'note'+(warn?' warn':'')},text));}
/** Methodology stays one click away instead of interrupting the figures. */
function method(parent,text,title){const d=el('details',{class:'method'});d.append(el('summary',null,title||'How this is measured'));const b=el('div');for(const para of[].concat(text))b.append(el('p',null,para));d.append(b);parent.append(d);return d;}
function collapsible(parent,title,count,open){const d=el('details',open?{open:''}:null);const s=el('summary',null,title);if(count!=null)s.append(el('span',{class:'count'},'('+count+')'));d.append(s);parent.append(d);return d;}
function confClass(c){c=(c||'').toLowerCase();return c.startsWith('confirmed')?'confirmed':c.startsWith('estimated')||c.startsWith('legacy')?'estimated':c.startsWith('inferred')?'inferred':'observed';}
function valueNode(value){const v=el('div',{class:'v'});const s=String(value);
  if(s===NONE){v.classList.add('none');v.textContent=NONE;v.setAttribute('aria-label','Unavailable');v.title='Unavailable in this recording';return v;}
  const m=/^([−+-]?[\d.,]+)\s?(%|m|s|HP|t)$/.exec(s);if(m){v.append(document.createTextNode(m[1]),el('span',{class:'u'},m[2]));return v;}
  if(!/^[\d−+\-.,\s/×()%]+$/.test(s))v.classList.add('text');v.textContent=s;return v;}

  const top=el('div',{class:'top'});top.append(el('div',{class:'l'},label));c.append(top,valueNode(value));
  const foot=el('div',{class:'foot'}),cap0=el('div',{class:'c'});cap0.append(el('span',null,caption||''));foot.append(cap0);c.append(foot);

    const id='def'+(++uid);const b=el('button',{class:'info',type:'button','aria-expanded':'false','aria-controls':id,'aria-label':'Definition of '+label,title:'Definition'},'?');
    const def=el('p',{class:'def',id,hidden:''},d.help+(d.unit?' Unit: '+d.unit+'.':''));b.onclick=()=>{const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',open);def.hidden=!open;};top.append(b);foot.append(def);}
  return c;}
function cards(parent,list){const g=el('div',{class:'cards'});for(const x of list)g.append(card(...x));parent.append(g);return g;}
/** Secondary statistics as a compact list: [label, value, caption?]. */
function kv(parent,list){const d=el('dl',{class:'kv'});for(const[l,v,c]of list){const r=el('div');r.append(el('dt',null,l),el('dd',v===NONE?{class:'none','aria-label':'Unavailable'}:null,v));if(c)r.append(el('small',null,c));d.append(r);}parent.append(d);return d;}
function label(key,fallback){return METRIC[key]?METRIC[key].label:fallback;}
function facts(parent,lines){const u=el('ul',{class:'facts'});for(const l of lines)u.append(el('li',null,l));parent.append(u);}
function select(parent,labelText,options,onchange){const l=el('label',null,labelText);const s=el('select');for(const[v,t]of options)s.append(el('option',{value:v},t));s.onchange=()=>onchange(s.value);l.append(s);parent.append(l);return s;}
function controls(parent){const c=el('div',{class:'controls'});parent.append(c);return c;}
/** Section jump links with a lightweight current-section indicator. */
function chips(parent,list){const n=el('nav',{class:'chips','aria-label':'Sections in this tab'});const links={};
  for(const[id,name]of list){const a=el('a',{href:'#'+id},name);links[id]=a;a.onclick=e=>{e.preventDefault();const t=$(id);if(t)t.scrollIntoView({block:'start',behavior:reduceMotion?'auto':'smooth'});};n.append(a);}

    queueMicrotask(()=>{for(const[id]of list){const t=$(id);if(t)io.observe(t);}});signal.addEventListener('abort',()=>io.disconnect());}
  return n;}
function stack(parent,items,aria){const total=items.reduce((a,b)=>a+(b.v||0),0);const box=el('div',{class:'chart'});const bar=el('div',{class:'bar',role:'img','aria-label':aria||items.map(i=>i.name+' '+i.v).join(', ')});const t=tip(box);

  const l=el('div',{class:'legend'});for(const it of items){const s=el('span');const i=el('i');i.style.background=it.color;s.append(i,document.createTextNode(it.name+' '+(it.v??0)+(total?' · '+pct(100*(it.v||0)/total):'')));l.append(s);}parent.append(l);if(!total)parent.append(el('p',{class:'muted'},'No observations.'));}
function table(parent,heads,rows,right,max){const wrap=el('div',{class:'scroll'});const t=el('table');const tr=el('tr');heads.forEach((h,i)=>tr.append(el('th',right&&right[i]?{class:'r',scope:'col'}:{scope:'col'},h)));const th=el('thead');th.append(tr);t.append(th);const tb=el('tbody');for(const r of rows.slice(0,max||rows.length)){const row=el('tr');r.forEach((c,i)=>{const td=el('td',right&&right[i]?{class:'r'}:null);if(c instanceof Node)td.append(c);else td.textContent=c;row.append(td);});tb.append(row);}t.append(tb);wrap.append(t);if(rows.length)parent.append(wrap);else parent.append(el('p',{class:'muted'},'No rows.'));return tb;}
function ink(text,cls){return el('span',{class:cls},text);}

// ---- report header ----
const R=D.resolution||{classification:String(F.outcome||'UNKNOWN'),label:cap(F.outcome),source:'',confidence:'OBSERVED',notes:[]};
const cls=R.classification||'';
const short={CONFIRMED_WIN:'Win',INFERRED_WIN:'Win · inferred',CONFIRMED_LOSS:'Loss',INFERRED_LOSS:'Loss · inferred',DRAW:'Draw',UNKNOWN:'Result unknown',INTERRUPTED:'Interrupted'}[cls]||R.label||'Result unknown';
const tone=cls.endsWith('WIN')?'win':cls.endsWith('LOSS')?'loss':cls==='INTERRUPTED'?'interrupted':'neutral';
const opp=P.opponentLabel||'Opponent';
$('result-line').append(el('span',{class:'result '+tone},short),el('span',{class:'result-detail'},[R.label,R.source].filter(Boolean).join(' · ')+(R.derived&&!/0\.1\.3/.test(R.source||'')?' · derived from a pre-0.1.3 recording':'')));
const title=scopeTitle||(F.session?'Manual recording session':'Fight vs '+opp);
$('title').textContent=title;
document.title=title+' · '+short+' · Phenomena';
const server=F.matchEvidence?.server||ROOT.fight.matchEvidence?.server;
const when=new Date(F.startEpochMillis);
const whenText=isNaN(when)?NONE:when.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'});
const status=cls==='INTERRUPTED'?'Interrupted'+(R.source?' — '+R.source.toLowerCase():''):F.session?'Manual session'+(F.session.termination?' — '+F.session.termination:''):R.derived?'Historical recording':'Complete';
const meta=[[F.session?'Participants':'Opponent',F.session?String((F.session.participants||[]).length):opp],
  ['Server',server||(P.anonymized?'Hidden (anonymized)':'Not recorded')],
  ['Date and time',whenText],
  ['Duration',dur2(dur)+(fin(S.combatActiveSeconds)?' · '+num(S.combatActiveSeconds,1)+' s in combat':'')],
  ['Recording',status],
  ['Evidence',cap(R.confidence)+(R.scope?' · '+cap(R.scope)+' scope':'')]];
for(const[k,v]of meta){const d=el('div');d.append(el('dt',null,k),el('dd',null,v));$('meta').append(d);}
const coverage=[];
if(F.schemaVersion<2)coverage.push('Recorded before 0.1.2: aim regions, perfect-spacing hits and weapon timing were not measured.');
if(!V3)coverage.push('Recorded before 0.1.3: shield, health, knockback and server critical-hit observations are unavailable. They are shown as “—”, not zero.');
if(!S.measurementVersion)coverage.push('Historical measurement policy: swing classification and combat-active time are unavailable; original counts are preserved.');
if(!P.motionIncluded)coverage.push('Motion traces were omitted from this file; derived values still use the complete recording.');
for(const c of coverage)$('coverage').append(el('li',null,c));
$('facts').textContent=['Report format v'+P.version,'recording schema '+D.schema,P.anonymized?'names and server anonymized':'names not anonymized',E.length+' events'].join(' · ');
$('status').textContent=P.anonymized?'Offline · anonymized':'Offline';

// ---- tabs (hash routed, arrow-key navigation) ----
const TABS=[['overview','Overview'],['offense','Offense'],['defense','Defense'],['flow','Fight Flow'],['timeline','Timeline']];
const built={};
for(const[id,name]of TABS){const b=el('button',{role:'tab',type:'button',id:'t-'+id,'aria-controls':'p-'+id,'aria-selected':'false',tabindex:'-1'},name);b.onclick=()=>show(id,true);$('tabs').append(b);}
$('tabs').onkeydown=e=>{const i=TABS.findIndex(t=>$('t-'+t[0]).getAttribute('aria-selected')==='true');let j=i;if(e.key==='ArrowRight')j=(i+1)%TABS.length;else if(e.key==='ArrowLeft')j=(i+TABS.length-1)%TABS.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=TABS.length-1;else return;e.preventDefault();show(TABS[j][0],true);$('t-'+TABS[j][0]).focus();};
let current=null,builtWidth=0;
function show(id,push){if(!TABS.some(t=>t[0]===id))id='overview';current=id;for(const[t]of TABS){const on=t===id;$('t-'+t).setAttribute('aria-selected',on);$('t-'+t).tabIndex=on?0:-1;$('p-'+t).classList.toggle('on',on);}
  if(!built[id]){built[id]=true;if(!builtWidth)builtWidth=cw();BUILD[id]($('p-'+id));}
  if(push){try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);}catch(e){}const bar=document.querySelector('.tabs-bar');if(bar.getBoundingClientRect().top<=0)window.scrollTo({top:$('main').getBoundingClientRect().top+window.scrollY-bar.offsetHeight,behavior:'auto'});}}
window.onhashchange=()=>show(location.hash.slice(1));
/** Charts are pixel-true, so a material width change rebuilds the visible tab and keeps its control values. */
rebuildTab=()=>{const w=cw();if(!current||Math.abs(w-builtWidth)<24)return;builtWidth=w;const p=$('p-'+current);
  const vals=[...p.querySelectorAll('select,input')].map(x=>x.value);const y=window.scrollY;
  for(const k in built)delete built[k];p.replaceChildren();built[current]=true;BUILD[current](p);
  [...p.querySelectorAll('select,input')].forEach((x,i)=>{if(vals[i]!=null&&x.value!==vals[i]){x.value=vals[i];x.dispatchEvent(new Event(x.tagName==='SELECT'?'change':'input'));}});window.scrollTo(0,y);
  for(const[t]of TABS)if(t!==current)$('p-'+t).replaceChildren();};

// ---- derived helpers ----
const hits=D.hits||[],misses=D.misses||[];
const hitBySeq={};for(const h of hits)hitBySeq[h.seq]=h;
const outcomes=D.attemptOutcomes||{};
const canonicalId=e=>F.statistics?.attackCanonicalIds?.[e.sequence]??e.sequence;

const combos=D.combos||{marks:[],streaks:[],exchanges:[],gap:3};
const comboList=(combos.streaks||[]).filter(s=>s.length>=2);
const incoming=D.incomingDetail||[];
const shields=D.shields||{available:false,events:[]};
const dom=D.dominance||null;
const rounds=(F.matchEvidence?.rounds||[]).map(r=>({n:r.number,start:(r.startNanos-base)/1e9,end:r.endNanos==null?null:(r.endNanos-base)/1e9,outcome:r.outcome,rule:r.rule}));
const active=S.measurementVersion?(D.combatExchanges||[]):[];
const endWord={RETALIATION:'an attributed return hit',TRADE:'a same-tick trade',DISENGAGE:'disengagement',RECORDING_END:'the end of the recording',ROUND_BOUNDARY:'a round boundary'};
const attrName={OPPONENT_DIRECT:'Opponent, melee',OPPONENT_INDIRECT:'Opponent, indirect',OPPONENT_LEGACY:'Opponent (pre-0.1.3)',OTHER_ENTITY:'Third party',UNATTRIBUTED:'Unattributed'};
const gradeColor={IDEAL:C.ideal,GOOD:C.goodaim,PERIPHERAL:C.peripheral,POOR:C.poor,UNAVAILABLE:C.muted};

function unavailable(parent,what){note(parent,'This recording was made before 0.1.3 and has no '+what+'. Shown as unavailable rather than zero.');}
function roundInk(o){if(!o)return ink('Not announced','ink-dim');const s=String(o);return ink(/^[A-Z_]+$/.test(s)?cap(s):s,/win|won/i.test(s)?'ink-win':/loss|lost/i.test(s)?'ink-loss':'');}

// ---- charts ----
/** Two-lane combo timeline; combos are selectable (click, Enter) and listed in the select. */
function comboTimeline(parent,onSelect){
  const W=cw(),narrow=W<560,H=158,L=narrow?60:92,R=10,T=18,LH=38,G=16;const{box,svg,t}=chartBox(parent,W,H,'Combo timeline: your confirmed hits above, attributed opponent hits below; combos are bands labeled with their length');
  const tx=v=>L+(W-L-R)*Math.max(0,Math.min(1,v/dur));const top=T,bot=T+LH+G;
  svgText(svg,0,top+LH/2+4,'You',{fill:C.you,'font-size':13,'font-weight':600});svgText(svg,0,bot+LH/2+4,narrow?'Opp.':'Opponent',{fill:C.opp,'font-size':13,'font-weight':600});
  for(const y of[top,bot])laneBg(svg,L,y,W-L-R,LH);
  for(const r of rounds)if(r.n>1){const x=tx(r.start);svg.append(sv('line',{x1:x,x2:x,y1:top-4,y2:bot+LH,stroke:C.axis,'stroke-dasharray':'3 3'}));}
  for(const ex of combos.exchanges||[])svg.append(sv('line',{x1:tx(ex.start)-3,x2:tx(ex.start)-3,y1:top,y2:bot+LH,stroke:C.grid}));
  const bands=[],fitTop=slots(),fitBot=slots();
  comboList.forEach((c,i)=>{const local=c.side==='LOCAL',y=local?top:bot,x0=tx(c.start)-4,x1=Math.max(x0+8,tx(c.end)+4);
    const r=sv('rect',{x:x0,y:y+5,width:x1-x0,height:LH-10,rx:3,fill:local?C.youBand:C.oppBand,tabindex:0,role:'button','aria-label':(local?'Your':'Opponent')+' combo of '+c.length+' hits at '+num(c.start,2)+' s'});
    r.addEventListener('click',()=>onSelect(i));r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onSelect(i);}});
    hoverTip(r,t,box,(local?'Your':'Opponent')+' combo: '+c.length+' hits, '+num(c.end-c.start,2)+' s, ended by '+endWord[c.endedBy]);svg.append(r);bands.push(r);
    if((local?fitTop:fitBot)((x0+x1)/2,'×'+c.length,12))svgText(svg,(x0+x1)/2,y-3,'×'+c.length,{'text-anchor':'middle',fill:C.text,'font-size':12,'font-weight':600});});
  for(const m of combos.marks||[]){const local=m.side==='LOCAL',y=local?top:bot,x=tx(m.t),color=local?C.you:C.opp;
    const n=m.traded?sv('rect',{x:x-4,y:y+LH/2-4,width:8,height:8,fill:'none',stroke:color,'stroke-width':2}):sv('rect',{x:x-1.5,y:y+9,width:3,height:LH-18,rx:1,fill:color});
    hoverTip(n,t,box,(local?'Your confirmed hit':'Attributed opponent hit')+' at '+num(m.t,2)+' s'+(m.traded?' (same-tick trade)':''));svg.append(n);}
  timeAxis(svg,L,W-R,bot+LH+6,dur);
  if(!(combos.marks||[]).length)emptyText(svg,W,H-24,'No confirmed hits in this fight');
  legend(parent,[{name:'Your hit',color:C.you},{name:'Attributed opponent hit',color:C.opp},{name:'Same-tick trade',color:C.muted,hollow:true},{name:'Combo band (×length)',color:'rgba(57,135,229,.6)'},...(rounds.length>1?[{name:'Round start',color:C.axis}]:[])]);
  return i=>bands.forEach((b,k)=>{const on=k===i;b.setAttribute('stroke',on?C.text:'none');b.setAttribute('stroke-width',on?2:0);});
}
/** Dominance: positive = you, negative = opponent; gaps where evidence is insufficient. */
function dominanceChart(parent){
  if(!dom){note(parent,'Dominance data unavailable in this report version.');return;}
  const W=cw(),narrow=W<560,H=280,L=narrow?44:70,R=10,T=14,PH=H-T-58;const{box,svg,t}=chartBox(parent,W,H,'Encounter dominance over time. Above the centerline favors you, below favors the opponent. Empty columns have no evidence; dotted columns have unattributed incoming damage.');
  const step=dom.step,vals=dom.values||[],st=dom.states||'',maxT=Math.max(dur,(vals.length-1)*step);
  const tx=v=>L+(W-L-R)*v/maxT,ty=v=>T+PH/2-v*(PH/2-2),zero=ty(0);
  const defs=sv('defs');const pat=sv('pattern',{id:'dots',width:4,height:4,patternUnits:'userSpaceOnUse'});pat.append(sv('rect',{width:2,height:2,fill:C.incomplete}));defs.append(pat);svg.append(defs);
  laneBg(svg,L,T,W-L-R,PH);
  for(const v of[.5,-.5])svg.append(sv('line',{x1:L,x2:W-R,y1:ty(v),y2:ty(v),stroke:C.grid}));
  svgText(svg,L-6,T+12,narrow?'+1':'+1 you',{'text-anchor':'end',fill:C.you});svgText(svg,L-6,zero+4,'0',{'text-anchor':'end'});svgText(svg,L-6,T+PH-3,narrow?'−1':'−1 opp.',{'text-anchor':'end',fill:C.opp});
  const fitB=slots(),bounds=(D.boundaries||[]).filter(b=>b.accepted&&['START','ROUND_START','RESULT'].includes(b.kind)&&fin(b.time)&&b.time>=-1e-6&&b.time<=maxT+1e-6),dense=bounds.length>12;for(const b of bounds){const x=tx(b.time);svg.append(sv('line',{x1:x,x2:x,y1:T,y2:T+PH,stroke:'#59636b','stroke-dasharray':'3 3','stroke-opacity':dense?.45:1}));if(!dense){const right=x>W-R-70,lab=b.kind==='ROUND_START'?'Round':cap(b.kind);if(fitB(right?x-3:x+3,lab,11,right?'end':'start'))svgText(svg,right?x-3:x+3,T+11,lab,{'font-size':11,'text-anchor':right?'end':'start',fill:C.dim});}}
  const color={L:'rgba(57,135,229,.55)',O:'rgba(217,89,38,.55)',N:'rgba(138,148,154,.45)'};
  let d='',pen=false;const cw0=Math.max(1,tx(step)-tx(0)+.5);
  for(let k=0;k<vals.length;k++){const v=vals[k],s=st[k];const x=tx(k*step);
    if(v==null||s==='I'){pen=false;continue;}
    const y=ty(v);svg.append(sv('rect',{x,y:Math.min(y,zero),width:cw0,height:Math.abs(zero-y)+(s==='C'?1:.5),fill:s==='C'?'url(#dots)':color[s]}));
    d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);pen=true;}
  svg.append(sv('path',{d,fill:'none',stroke:C.text,'stroke-width':1.5,'stroke-opacity':.85,'stroke-linejoin':'round'}));
  svg.append(sv('line',{x1:L,x2:W-R,y1:zero,y2:zero,stroke:C.text,'stroke-opacity':.5}));

  if(sprintOn!=null)sprint(sprintOn,dur);
  marks.sort((a,b)=>a.dataset.t-b.dataset.t);const markT=marks.map(m=>+m.dataset.t);
  timeAxis(svg,L,W-R,8+lanes.length*LH+4,dur);
  const head=sv('line',{y1:2,y2:8+lanes.length*LH+2,stroke:C.warn,'stroke-width':2});svg.append(head);
  svg.addEventListener('pointermove',ev=>{if(ev.target.dataset&&ev.target.dataset.seg)return;const r=svg.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width;let best=null,bd=8;const i=upper(markT,(mx-L)/(W-L-R)*dur);for(let k=Math.max(0,i-12);k<Math.min(marks.length,i+12);k++){const d=Math.abs(tx(markT[k])-mx);if(d<bd){bd=d;best=marks[k];}}if(best)place(t,box,ev.clientX,ev.clientY,best.dataset.k+' · '+(+best.dataset.t).toFixed(2)+' s');else t.style.display='none';});

  legend(p,[{name:'Correlated hit',color:C.you},{name:'No server report',color:C.opp,hollow:true},{name:'Shield block',color:C.good},{name:'Empty swing',color:C.muted},{name:'Attributed incoming',color:C.opp},{name:'Unattributed damage',color:C.muted,hollow:true},{name:'Server crit',color:C.warn},{name:'Playhead',color:C.warn}]);

  const wrap=el('div',{class:'scroll'});const tbl=el('table');const hr=el('tr');for(const[h,r]of[['Time',1],['Event',0],['Confidence',0],['Details',0]])hr.append(el('th',r?{class:'r',scope:'col'}:{scope:'col'},h));const thd=el('thead');thd.append(hr);tbl.append(thd);const tb=el('tbody');tbl.append(tb);wrap.append(tbl);p.append(wrap);
  // Sorted indexes make each playhead update proportional to what changed, not to the recording size.
  const ET=E.map(sec);const ORDER=E.map((e,i)=>i).sort((a,b)=>ET[a]-ET[b]||a-b);const OT=ORDER.map(i=>ET[i]);
  const times=OT.filter((x,k)=>E[ORDER[k]].kind!=='MOTION');
  function upper(arr,v){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<=v+1e-9)lo=m+1;else hi=m;}return lo;}
  const hitT=hits.map(h=>h.t).sort((a,b)=>a-b);
  const atT=ORDER.filter(i=>E[i].kind==='ATTACK'&&isCanonical(E[i])&&outcomes[E[i].sequence]!=='EXCLUDED').map(i=>ET[i]);
  const inT=(D.incoming||[]).slice().sort((a,b)=>a-b);
  const cmarks=(combos.marks||[]).slice().sort((a,b)=>a.t-b.t);const cmT=cmarks.map(m=>m.t);
  let T=0,playing=false,last=0,lastIdx=-1,lastKind=null,shownMarks=marks.length;
  function describe(e){if(!e)return['Start of recording',''];const h=hitBySeq[e.sequence];const o=outcomes[e.sequence];
    if(e.kind==='ATTACK'&&S.measurementVersion&&isCanonical(e)&&o==='UNRESOLVED')return['Unresolved attack','Outcome evidence is insufficient; included in the accuracy denominator.'];
    if(e.kind==='ATTACK'&&S.measurementVersion){if(!isCanonical(e))return['Deduplicated observation','Canonical attack '+canonicalId(e)+'; no additional attempt, hit or miss.'];if(o==='EXCLUDED')return['Excluded noncombat swing','No aimed opponent evidence. Excluded from combat accuracy.'];if(o==='MISS')return['Eligible miss','Aimed empty swing; no hit confirmation in the bounded window.'];if(o==='UNCERTAIN_SHIELD')return['Uncertain shield interaction','Blocking/facing observation without a correlated shield sound; retained in the denominator.'];}
    if(e.kind==='ATTACK'){if(h)return['Correlated hit',m2(h.reach)+(h.contact?' ray contact':' nearest box')+' · '+(h.measurement?.timing?cap(h.measurement.timing.grade)+' attempt timing':'Timing unavailable')+' · combo '+h.combo+(h.serverCrit?' · server crit':h.critical?' · crit conditions':'')+(h.sprinting?' · sprinting':'')];if(o&&o.startsWith('SHIELD'))return['Shield '+(o==='SHIELD_DISABLE'?'disabled':'block'),'The opponent\'s shield blocked this attack; no damage event.'];if(!isEmpty(e))return['Attack without server report','Estimated distance '+m2(e.attack.reach)+'. Uncertain, not a proven miss.'];return['Empty swing','No entity selected. Confirmed miss.'+(e.attack?' Distance to the recent opponent '+m2(e.attack.reach)+'.':'')];}
    if(e.kind==='HURT')return['Server damage report','Local melee source; amount unavailable.'];
    if(e.kind==='DAMAGE_IN'){const a=e.context?.attribution;return[a&&!a.startsWith('OPPONENT')?'Unattributed damage':'Incoming hit',a?attrName[a]||a:'Server damage event'];}
    if(e.kind==='SHIELD')return['Shield '+(e.context?.shield||'').toLowerCase(),'At '+(e.context?.subject==='local'?'you':'the opponent')];
    if(e.kind==='CRIT')return['Server critical hit','On '+(e.context?.subject==='local'?'you':'the opponent')];
    if(e.kind==='JUMP')return['Jump',e.detail||''];if(e.kind==='SPRINT')return[e.detail==='true'?'Sprint started':'Sprint stopped',''];
    if(e.kind==='DEATH')return['Death observed',e.detail||''];if(e.kind==='DISCONNECT')return['Disconnected',e.detail||''];return[cap(e.kind),e.detail||''];}
  function detailText(e){const h=hitBySeq[e.sequence];if(e.attack)return(h?'Hit · ':'')+'Cooldown '+num(e.attack.cooldown,2)+' · Reach '+num(e.attack.reach,2)+' m'+(e.attack.rayContact?' · Aim '+[e.attack.aimX,e.attack.aimY,e.attack.aimZ].map(v=>num(v,2)).join(', '):' · no ray contact');const c=e.context;if(c){if(e.kind==='HEALTH')return'Health '+num(c.health,1)+(c.absorption?' + '+num(c.absorption,1):'');if(e.kind==='VELOCITY')return'Velocity '+[c.vx,c.vy,c.vz].map(v=>num(v,3)).join(', ');if(e.kind==='DAMAGE_IN')return(attrName[c.attribution]||'')+(c.damageType?' · '+item(c.damageType):'');}return e.detail||'';}
  function update(){const k=filter.value;seek.value=Math.round(1000*T/dur);clk.textContent=T.toFixed(2)+' / '+dur.toFixed(2)+' s';head.setAttribute('x1',tx(T));head.setAttribute('x2',tx(T));
    const mi=upper(markT,T);if(mi!==shownMarks){const a=Math.min(mi,shownMarks),b=Math.max(mi,shownMarks);for(let i=a;i<b;i++)marks[i].setAttribute('opacity',i<mi?1:.35);shownMarks=mi;}
    const idx=upper(OT,T);if(idx===lastIdx&&k===lastKind)return;lastIdx=idx;lastKind=k;
    const rows=[];for(let j=idx-1;j>=0&&rows.length<200;j--){const e=E[ORDER[j]];if(k==='All'?e.kind!=='MOTION':e.kind===k)rows.push(e);}rows.reverse();
