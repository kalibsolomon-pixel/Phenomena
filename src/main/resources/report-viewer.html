<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>KWAMSTER Fight Report</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111417;--surface:#1b2025;--surface-2:#22282d;--hover:#2c3338;--pressed:#16191c;
  --border:#3b434b;--border-soft:#2c3238;--grid:#2a3036;
  --text:#e6ecea;--muted:#9aa6ac;--dim:#7d878d;
  --accent:#88c8aa;--warn:#e4c46e;
  --you:#3987e5;--opp:#d95926;--good:#199e70;--neutral:#8a949a;--incomplete:#5e676d;
  --ideal:#56b4e9;--goodaim:#009e73;--peripheral:#e69f00;--poor:#cc79a7;
  --mono:"Minecraft","Minecraftia","Monocraft",ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 var(--mono);letter-spacing:.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}
header.top{background:#15191c;border-bottom:1px solid var(--border-soft)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;color:var(--accent)}
.sub{color:var(--dim)}
.badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.badge{border:1px solid var(--border);padding:1px 7px;color:var(--muted);font-size:12px}
.ident{padding:16px 0 4px}
.ident h1{font-size:18px;margin:0 0 4px;font-weight:700}
.ident p{margin:0;color:var(--muted)}
nav.tabs{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--border-soft);overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--text)}
nav.tabs button[aria-selected=true]{background:var(--surface);color:var(--text);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main.panel{background:var(--surface);border:1px solid var(--border-soft);border-top:0;padding:16px}
section[role=tabpanel]{display:none}
section[role=tabpanel].on{display:block}
nav.sections{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
nav.sections a{color:var(--muted);border:1px solid var(--border);padding:2px 9px;text-decoration:none;font-size:12px}
nav.sections a:hover{color:var(--text);background:var(--surface-2)}
h2{font-size:14px;font-weight:700;margin:24px 0 8px;display:flex;align-items:center;gap:10px;scroll-margin-top:8px}
h2:first-child,nav.sections+h2{margin-top:6px}
h2::after{content:"";flex:1;height:1px;background:var(--border-soft)}
h2 small{color:var(--dim);font-weight:400;order:2}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.card{background:var(--surface-2);padding:8px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);min-width:0}
.card .l{color:var(--muted);font-size:12px}
.card .v{font-size:18px;font-weight:700;margin:2px 0;overflow-wrap:anywhere}
.card .v.none{color:var(--dim)}
.card .c{color:var(--dim);font-size:11px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 6px;align-items:baseline}
.card.result .v{font-size:16px}
.tag{display:inline-block;font-size:10px;border:1px solid var(--border);color:var(--dim);padding:0 4px;white-space:nowrap;margin-left:auto}
.note{background:rgba(34,40,45,.6);border-left:2px solid var(--border);padding:8px 12px;color:var(--muted);margin:10px 0}
.note.warn{border-left-color:var(--warn)}
ul.facts{margin:6px 0 0;padding-left:18px;color:var(--text)}
ul.facts li{margin:3px 0}
p.muted{color:var(--muted);margin:6px 0}
button.mc,select.mc,select{background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:5px 10px;font:inherit;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.25);max-width:100%}
button.mc:hover,select:hover{background:var(--hover)}
button.mc:active{background:var(--pressed);box-shadow:none}
button.mc[aria-pressed=true]{border-color:var(--accent)}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.controls label{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.controls output{color:var(--muted);min-width:120px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.chart{position:relative;background:rgba(34,40,45,.55);margin:4px 0}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:4px 0 2px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
.legend i.hollow{background:transparent!important;border:2px solid}
.legend i.dotted{background:repeating-linear-gradient(45deg,var(--incomplete) 0 2px,transparent 2px 4px)!important}
.tip{position:absolute;pointer-events:none;background:#0d0f11;border:1px solid var(--border);padding:3px 7px;font-size:12px;white-space:nowrap;display:none;z-index:2;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--border-soft)}
th{color:var(--dim);font-weight:400;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right}
tr.cur td,tr.sel td{background:var(--hover)}
.scroll{max-height:360px;overflow:auto;border:1px solid var(--border-soft)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0}
.annot{background:var(--surface-2);border-left:2px solid var(--accent);padding:8px 12px;min-height:38px}
.annot b{font-weight:700}
.empty{color:var(--muted);padding:18px;text-align:center}
svg .sel{stroke:var(--text);stroke-width:2}
svg [tabindex]{cursor:pointer}
footer{color:var(--dim);font-size:12px;padding-top:14px}
@media (max-width:720px){.split{grid-template-columns:1fr}.badges{margin-left:0}main.panel{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.reduced *{transition:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand">KWAMSTER</span><span class="sub">Fight report</span><span class="badges" id="badges"></span></div></header>
<div class="wrap">
<div class="ident"><h1 id="title">Fight</h1><p id="subtitle"></p></div>
<div id="session-controls"></div>
<nav class="tabs" role="tablist" aria-label="Report sections" id="tabs"></nav>
<main class="panel">
<section role="tabpanel" id="p-overview" aria-labelledby="t-overview"></section>
<section role="tabpanel" id="p-offense" aria-labelledby="t-offense"></section>
<section role="tabpanel" id="p-defense" aria-labelledby="t-defense"></section>
<section role="tabpanel" id="p-flow" aria-labelledby="t-flow"></section>
<section role="tabpanel" id="p-timeline" aria-labelledby="t-timeline"></section>
</main>
<footer>Generated locally by KWAMSTER. This file makes no network requests and nothing was uploaded. Share the folder yourself if you choose.</footer>
</div>
<script id="data" type="application/json">__KWAMSTER_PAYLOAD__</script>
<script>
'use strict';
(function(){
const ROOT=JSON.parse(document.getElementById('data').textContent);
let renderAbort;
function render(P){
if(renderAbort)renderAbort.abort();
renderAbort=new AbortController();const signal=renderAbort.signal;
for(const id of ['tabs','badges','p-overview','p-offense','p-defense','p-flow','p-timeline'])document.getElementById(id).replaceChildren();
const F=P.fight, D=P.derived, S=D.summary, E=F.events||[];
const base=F.matchEvidence?.timelineStartNanos??(E.length?E[0].nanoTime:0), dur=Math.max(S.duration||0,.001);
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
if(P.reducedMotion)document.documentElement.classList.add('reduced');
const METRIC={};for(const m of P.metrics||[])METRIC[m.key]=m;
const V3=!!S.contextAvailable;

// ---- formatting (mirrors analytics.Format) ----
const NONE='—';
const fin=v=>typeof v==='number'&&isFinite(v);
const pct=v=>fin(v)?v.toFixed(1)+'%':NONE;
const m2=v=>fin(v)?v.toFixed(2)+' m':NONE;
const s2=v=>fin(v)?v.toFixed(2)+' s':NONE;
const num=(v,d)=>fin(v)?v.toFixed(d):NONE;
const sgn=(v,d)=>fin(v)?(v>0?'+':'')+v.toFixed(d):NONE;
const sec=e=>(e.nanoTime-base)/1e9;
const isEmpty=e=>!e.attack||(e.detail||'').startsWith('empty-swing');
const cap=s=>s?(s=String(s).replace(/_/g,' '),s.charAt(0).toUpperCase()+s.slice(1).toLowerCase()):'';
const item=w=>w?String(w).split(';')[0].replace(/^minecraft:/,'').replace(/_/g,' '):'unknown';
function el(tag,attrs,text){const n=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')n.className=attrs[k];else n.setAttribute(k,attrs[k]);}if(text!=null)n.textContent=String(text);return n;}
function sv(tag,attrs){const n=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)n.setAttribute(k,attrs[k]);return n;}
function svgText(svg,x,y,text,attrs){const t=sv('text',Object.assign({x,y,fill:'#7d878d','font-size':11},attrs||{}));t.textContent=text;svg.append(t);return t;}
function h2(parent,text,small,id){const h=el('h2',id?{id}:null,text);if(small)h.append(el('small',null,small));parent.append(h);return h;}
function note(parent,text,warn){parent.append(el('div',{class:'note'+(warn?' warn':'')},text));}
function card(label,value,caption,key,extra){const c=el('div',{class:'card'+(extra?' '+extra:'')});const d=key&&METRIC[key];const cap0=el('div',{class:'c'});cap0.append(el('span',null,caption||''));if(d){cap0.append(el('span',{class:'tag'},d.confidence));c.title=d.confidence+': '+d.help;}c.append(el('div',{class:'l'},label),el('div',{class:'v'+(value===NONE?' none':'')},value),cap0);return c;}
function cards(parent,list){const g=el('div',{class:'cards'});for(const x of list)g.append(card(...x));parent.append(g);return g;}
function label(key,fallback){return METRIC[key]?METRIC[key].label:fallback;}
function sections(parent,list){const n=el('nav',{class:'sections','aria-label':'Sections'});for(const[id,name]of list){const a=el('a',{href:'#'+id},name);a.onclick=e=>{e.preventDefault();const t=$(id);if(t)t.scrollIntoView({block:'start'});};n.append(a);}parent.append(n);}
function facts(parent,lines){const u=el('ul',{class:'facts'});for(const l of lines)u.append(el('li',null,l));parent.append(u);}
function select(parent,labelText,options,onchange){const l=el('label',null,labelText);const s=el('select');for(const[v,t]of options)s.append(el('option',{value:v},t));s.onchange=()=>onchange(s.value);l.append(s);parent.append(l);return s;}
function controls(parent){const c=el('div',{class:'controls'});parent.append(c);return c;}

// ---- header ----
const opp=P.opponentLabel||'Opponent';
const R=D.resolution||{label:cap(F.outcome),source:'',confidence:'OBSERVED',notes:[]};
$('title').textContent='Fight vs '+opp+' — '+R.label;
$('subtitle').textContent=new Date(F.startEpochMillis).toLocaleString()+' · '+num(dur,1)+' s, '+E.length+' events · '+(R.source||'')+(R.derived?' (recording made before 0.1.3)':'');
for(const b of ['Offline',P.anonymized?'Anonymized':'Not anonymized',P.motionIncluded?'Motion included':'Motion omitted','Report v'+P.version,V3?'Schema '+D.schema:'Schema '+D.schema+': limited observations'])$('badges').append(el('span',{class:'badge'},b));

// ---- tabs (hash routed, arrow-key navigation) ----
const TABS=[['overview','Overview'],['offense','Offense'],['defense','Defense'],['flow','Fight Flow'],['timeline','Timeline']];
const built={};
for(const[id,name]of TABS){const b=el('button',{role:'tab',id:'t-'+id,'aria-controls':'p-'+id,'aria-selected':'false',tabindex:'-1'},name);b.onclick=()=>show(id,true);$('tabs').append(b);}
$('tabs').onkeydown=e=>{const i=TABS.findIndex(t=>$('t-'+t[0]).getAttribute('aria-selected')==='true');let j=i;if(e.key==='ArrowRight')j=(i+1)%TABS.length;else if(e.key==='ArrowLeft')j=(i+TABS.length-1)%TABS.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=TABS.length-1;else return;e.preventDefault();show(TABS[j][0],true);$('t-'+TABS[j][0]).focus();};
function show(id,push){if(!TABS.some(t=>t[0]===id))id='overview';for(const[t]of TABS){const on=t===id;$('t-'+t).setAttribute('aria-selected',on);$('t-'+t).tabIndex=on?0:-1;$('p-'+t).classList.toggle('on',on);}if(!built[id]){built[id]=true;BUILD[id]($('p-'+id));}if(push&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id);}catch(e){}}}
window.onhashchange=()=>show(location.hash.slice(1));

// ---- generic charts ----
function tip(box){const t=el('div',{class:'tip'});box.append(t);return t;}
function place(t,box,x,y,text){t.textContent=text;t.style.display='block';const r=box.getBoundingClientRect();let left=x-r.left+12;if(left+t.offsetWidth>r.width)left=x-r.left-t.offsetWidth-12;t.style.left=Math.max(0,left)+'px';t.style.top=Math.max(0,y-r.top-28)+'px';}
function hoverTip(node,t,box,text){node.addEventListener('mousemove',ev=>place(t,box,ev.clientX,ev.clientY,text));node.addEventListener('mouseleave',()=>t.style.display='none');}
function legend(parent,items){const l=el('div',{class:'legend'});for(const it of items){const s=el('span');const i=el('i',it.hollow?{class:'hollow'}:it.dotted?{class:'dotted'}:null);if(it.hollow)i.style.borderColor=it.color;else i.style.background=it.color;s.append(i,document.createTextNode(it.name));l.append(s);}parent.append(l);}
function chartBox(parent,W,H,aria){const box=el('div',{class:'chart'});const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':aria});box.append(svg);parent.append(box);return{box,svg,t:tip(box)};}
function emptyText(svg,W,H,text){svgText(svg,W/2,H/2,text,{'text-anchor':'middle',fill:'#9aa6ac','font-size':13});}
function timeAxis(svg,L,R,y,W,maxT){for(const v of[0,maxT/4,maxT/2,3*maxT/4,maxT]){const x=L+(W-L-R)*v/maxT;svg.append(sv('line',{x1:x,x2:x,y1:y,y2:y+4,stroke:'#3b434b'}));svgText(svg,x,y+16,num(v,1)+' s',{'text-anchor':v===0?'start':v===maxT?'end':'middle'});}}
function stack(parent,items,aria){const total=items.reduce((a,b)=>a+b.v,0);const W=900,H=18;const{box,svg,t}=chartBox(parent,W,H,aria||items.map(i=>i.name+' '+i.v).join(', '));let x=0;for(const it of items){if(!total||!it.v)continue;const w=W*it.v/total;const r=sv('rect',{x,y:0,width:Math.max(1,w-2),height:H,fill:it.color});hoverTip(r,t,box,it.name+': '+it.v+' ('+pct(100*it.v/total)+')');svg.append(r);x+=w;}if(!total)emptyText(svg,W,H,'No observations');const l=el('div',{class:'legend'});for(const it of items){const s=el('span');const i=el('i');i.style.background=it.color;s.append(i,document.createTextNode(it.name+' '+it.v));l.append(s);}parent.append(l);}
function table(parent,heads,rows,right,max){const wrap=el('div',{class:'scroll'});const t=el('table');const tr=el('tr');heads.forEach((h,i)=>tr.append(el('th',right&&right[i]?{class:'r',scope:'col'}:{scope:'col'},h)));const th=el('thead');th.append(tr);t.append(th);const tb=el('tbody');for(const r of rows.slice(0,max||rows.length)){const row=el('tr');r.forEach((c,i)=>row.append(el('td',right&&right[i]?{class:'r'}:null,c)));tb.append(row);}t.append(tb);wrap.append(t);parent.append(wrap);if(!rows.length)parent.append(el('p',{class:'muted'},'No rows.'));return tb;}
function bars(parent,o){
  const W=900,H=o.h||180,L=40,R=10,T=10,B=24;const{box,svg,t}=chartBox(parent,W,H,o.aria||'');
  const n=o.labels.length,g=o.groups.length;let max=0;for(const gr of o.groups)for(const v of gr.values)max=Math.max(max,v);
  const top=Math.max(1,max);for(const v of[0,top]){const y=T+(H-T-B)*(1-v/top);svg.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:v?'#2a3036':'#3b434b'}));svgText(svg,L-6,y+4,String(v),{'text-anchor':'end'});}
  const slot=(W-L-R)/n,bw=Math.min(28,(slot-6)/g);
  o.labels.forEach((lab,i)=>{o.groups.forEach((gr,k)=>{const v=gr.values[i]||0,h=(H-T-B)*v/top,x=L+i*slot+(slot-bw*g)/2+k*bw;const color=gr.colors?gr.colors[i]:gr.color;svg.append(sv('rect',{x:x+1,y:H-B-h,width:Math.max(1,bw-2),height:Math.max(0,h),fill:color}));const hit=sv('rect',{x,y:T,width:bw,height:H-T-B,fill:'transparent'});hoverTip(hit,t,box,lab+' · '+gr.name+': '+v);svg.append(hit);});
    svgText(svg,L+i*slot+slot/2,H-7,lab,{'text-anchor':'middle'});});
  if(!max)emptyText(svg,W,H,o.empty||'No samples');
  if(g>1)legend(parent,o.groups.map(gr=>({name:gr.name,color:gr.color})));
}

// ---- derived helpers ----
const hits=D.hits||[],misses=D.misses||[];
const hitBySeq={};for(const h of hits)hitBySeq[h.seq]=h;
const outcomes=D.attemptOutcomes||{};
const combos=D.combos||{marks:[],streaks:[],exchanges:[],gap:3};
const comboList=(combos.streaks||[]).filter(s=>s.length>=2);
const incoming=D.incomingDetail||[];
const shields=D.shields||{available:false,events:[]};
const dom=D.dominance||null;
const endWord={RETALIATION:'an attributed return hit',TRADE:'a same-tick trade',DISENGAGE:'disengagement',RECORDING_END:'the end of the recording',ROUND_BOUNDARY:'a round boundary'};
const attrName={OPPONENT_DIRECT:'Opponent, melee',OPPONENT_INDIRECT:'Opponent, indirect',OPPONENT_LEGACY:'Opponent (pre-0.1.3)',OTHER_ENTITY:'Third party',UNATTRIBUTED:'Unattributed'};
const gradeColor={IDEAL:'var(--ideal)',GOOD:'var(--goodaim)',PERIPHERAL:'var(--peripheral)',POOR:'var(--poor)',UNAVAILABLE:'#9aa6ac'};
const timingColor={PERFECT:'var(--good)',TOO_FAST:'var(--opp)',TOO_SLOW:'var(--you)'};
function unavailable(parent,what){note(parent,'This recording was made before 0.1.3 and has no '+what+'. Shown as unavailable rather than zero.');}

// ---- 0.1.3 charts ----
/** Two-lane combo timeline; combos are selectable (click, Enter) and listed in the select. */
function comboTimeline(parent,onSelect){
  const W=900,H=150,L=86,R=12,T=14,LH=36,G=14;const{box,svg,t}=chartBox(parent,W,H,'Combo timeline: your confirmed hits above, attributed opponent hits below; combos are bands labeled with their length');
  const tx=v=>L+(W-L-R)*Math.max(0,Math.min(1,v/dur));const top=T,bot=T+LH+G;
  svgText(svg,8,top+LH/2+4,'You',{fill:'#3987e5'});svgText(svg,8,bot+LH/2+4,'Opponent',{fill:'#d95926'});
  for(const y of[top,bot])svg.append(sv('rect',{x:L,y,width:W-L-R,height:LH,fill:'rgba(34,40,45,.9)'}));
  for(const ex of combos.exchanges||[])svg.append(sv('line',{x1:tx(ex.start)-3,x2:tx(ex.start)-3,y1:top,y2:bot+LH,stroke:'#2a3036'}));
  const bands=[];
  comboList.forEach((c,i)=>{const local=c.side==='LOCAL',y=local?top:bot,x0=tx(c.start)-4,x1=Math.max(x0+8,tx(c.end)+4);
    const r=sv('rect',{x:x0,y:y+5,width:x1-x0,height:LH-10,rx:3,fill:local?'rgba(57,135,229,.35)':'rgba(217,89,38,.35)',tabindex:0,role:'button','aria-label':(local?'Your':'Opponent')+' combo of '+c.length+' hits at '+num(c.start,2)+' s'});
    r.addEventListener('click',()=>onSelect(i));r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onSelect(i);}});
    hoverTip(r,t,box,(local?'Your':'Opponent')+' combo: '+c.length+' hits, '+num(c.end-c.start,2)+' s, ended by '+endWord[c.endedBy]);svg.append(r);bands.push(r);
    svgText(svg,(x0+x1)/2,local?y+3:y+LH+10,'×'+c.length,{'text-anchor':'middle',fill:'#e6ecea','font-size':12});});
  for(const m of combos.marks||[]){const local=m.side==='LOCAL',y=local?top:bot,x=tx(m.t),color=local?'var(--you)':'var(--opp)';
    const n=m.traded?sv('rect',{x:x-4,y:y+LH/2-4,width:8,height:8,fill:'none',stroke:color,'stroke-width':2}):sv('rect',{x:x-1.5,y:y+9,width:3,height:LH-18,fill:color});
    hoverTip(n,t,box,(local?'Your confirmed hit':'Attributed opponent hit')+' at '+num(m.t,2)+' s'+(m.traded?' (same-tick trade)':''));svg.append(n);}
  timeAxis(svg,L,R,bot+LH+4,W,dur);
  if(!(combos.marks||[]).length)emptyText(svg,W,H,'No confirmed hits in this fight');

  const annot=el('div',{class:'annot','aria-live':'polite'});p.append(annot);
  h2(p,'Events up to playhead');
  const fl=el('div',{class:'controls'});const filter=el('select',{class:'mc','aria-label':'Event filter'});for(const k of['All','ATTACK','HURT','DAMAGE_IN','SHIELD','CRIT','JUMP','SPRINT','HEALTH','VELOCITY','DEATH','MOTION'])filter.append(el('option',{value:k},k==='All'?'All events':k));fl.append(filter);p.append(fl);
  const wrap=el('div',{class:'scroll'});const tbl=el('table');const hr=el('tr');for(const h of['Time','Event','Confidence','Details'])hr.append(el('th',null,h));const thd=el('thead');thd.append(hr);tbl.append(thd);const tb=el('tbody');tbl.append(tb);wrap.append(tbl);p.append(wrap);
  const times=E.filter(e=>e.kind!=='MOTION').map(sec);
  let T=0,playing=false,last=0;
  function describe(e){if(!e)return['Start of recording',''];const h=hitBySeq[e.sequence];const o=outcomes[e.sequence];
    if(e.kind==='ATTACK'){if(h)return['Correlated hit',m2(h.reach)+(h.contact?' ray contact':' nearest box')+' · '+(h.measurement?.timing?cap(h.measurement.timing.grade)+' attempt timing':'Timing unavailable')+' · combo '+h.combo+(h.serverCrit?' · server crit':h.critical?' · crit conditions':'')+(h.sprinting?' · sprinting':'')];if(o&&o.startsWith('SHIELD'))return['Shield '+(o==='SHIELD_DISABLE'?'disabled':'block'),'The opponent\'s shield blocked this attack; no damage event.'];if(!isEmpty(e))return['Attack without server report','Estimated distance '+m2(e.attack.reach)+'. Uncertain, not a proven miss.'];return['Empty swing','No entity selected. Confirmed miss.'+(e.attack?' Distance to the recent opponent '+m2(e.attack.reach)+'.':'')];}
    if(e.kind==='HURT')return['Server damage report','Local melee source; amount unavailable.'];
    if(e.kind==='DAMAGE_IN'){const a=e.context?.attribution;return[a&&!a.startsWith('OPPONENT')?'Unattributed damage':'Incoming hit',a?attrName[a]||a:'Server damage event'];}
    if(e.kind==='SHIELD')return['Shield '+(e.context?.shield||'').toLowerCase(),'At '+(e.context?.subject==='local'?'you':'the opponent')];
    if(e.kind==='CRIT')return['Server critical hit','On '+(e.context?.subject==='local'?'you':'the opponent')];
    if(e.kind==='JUMP')return['Jump',e.detail||''];if(e.kind==='SPRINT')return[e.detail==='true'?'Sprint started':'Sprint stopped',''];
    if(e.kind==='DEATH')return['Death observed',e.detail||''];if(e.kind==='DISCONNECT')return['Disconnected',e.detail||''];return[cap(e.kind),e.detail||''];}
  function detailText(e){const h=hitBySeq[e.sequence];if(e.attack)return(h?'Hit · ':'')+'Cooldown '+e.attack.cooldown.toFixed(2)+' · Reach '+e.attack.reach.toFixed(2)+' m'+(e.attack.rayContact?' · Aim '+[e.attack.aimX,e.attack.aimY,e.attack.aimZ].map(v=>v.toFixed(2)).join(', '):' · no ray contact');const c=e.context;if(c){if(e.kind==='HEALTH')return'Health '+num(c.health,1)+(c.absorption?' + '+num(c.absorption,1):'');if(e.kind==='VELOCITY')return'Velocity '+[c.vx,c.vy,c.vz].map(v=>num(v,3)).join(', ');if(e.kind==='DAMAGE_IN')return(attrName[c.attribution]||'')+(c.damageType?' · '+item(c.damageType):'');}return e.detail||'';}
  function render(){const k=filter.value;seek.value=Math.round(1000*T/dur);clock.textContent=T.toFixed(2)+' / '+dur.toFixed(2)+' s';head.setAttribute('x1',tx(T));head.setAttribute('x2',tx(T));
    const upTo=E.filter(e=>sec(e)<=T+1e-9);const shown=upTo.filter(e=>k==='All'?e.kind!=='MOTION':e.kind===k);
    tb.replaceChildren();for(const e of shown.slice(-200)){const r=el('tr');for(const c of[sec(e).toFixed(3),e.kind,cap(e.confidence),detailText(e)])r.append(el('td',null,c));tb.append(r);}if(tb.lastChild)tb.lastChild.className='cur';wrap.scrollTop=wrap.scrollHeight;
    const lastEv=[...upTo].reverse().find(e=>e.kind!=='MOTION');const[a,b]=describe(lastEv);annot.replaceChildren(el('b',null,a),document.createTextNode(b?' — '+b:''));
    const hs=hits.filter(h=>h.t<=T),at=upTo.filter(e=>e.kind==='ATTACK').length,inc=(D.incoming||[]).filter(x=>x<=T).length;const k2=dom?Math.min((dom.values||[]).length-1,Math.max(0,Math.round(T/dom.step))):-1;const dv=dom&&k2>=0?dom.values[k2]:null;
    const cur=(combos.marks||[]).filter(m=>m.t<=T);let run=0;for(let i=cur.length-1;i>=0&&cur[i].side==='LOCAL'&&!cur[i].traded;i--)run++;
    now.replaceChildren(card('Hits so far',String(hs.length),at+' attempts'),card('Attributed incoming',String(inc),'opponent hits'),card('Current streak',String(run),'your unanswered hits'),card('Dominance',dv==null?NONE:num(dv,2),dom?{L:'you',O:'opponent',N:'neutral',C:'incomplete',I:'no evidence'}[(dom.states||'')[k2]]||'':'unavailable','dominance'));
    for(const m of marks)m.setAttribute('opacity',+m.dataset.t<=T?1:.35);}
  function setT(v){T=Math.max(0,Math.min(dur,v));render();}
  function frame(ts){if(!playing||signal.aborted)return;if(last)setT(T+(ts-last)/1000*Number(speed.value));last=ts;if(T>=dur){toggle(false);return;}requestAnimationFrame(frame);}
  function toggle(on){playing=on;play.textContent=on?'Pause':'Play';play.setAttribute('aria-label',on?'Pause':'Play');last=0;if(on){if(T>=dur)T=0;requestAnimationFrame(frame);}}
  play.onclick=()=>toggle(!playing);
  next.onclick=()=>{const n=times.find(x=>x>T+1e-6);setT(n!=null?n:dur);};
  prev.onclick=()=>{const c=[...times].reverse().find(x=>x<T-1e-6);setT(c!=null?c:0);};
  seek.oninput=()=>setT(Number(seek.value)/1000*dur);filter.onchange=render;
  document.addEventListener('keydown',e=>{if(!$('p-timeline').classList.contains('on')||e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key===' '){e.preventDefault();toggle(!playing);}else if(e.key==='.')next.click();else if(e.key===',')prev.click();},{signal});
  render();
  note(p,'Playback advances through the recorded timestamps at the chosen speed. It annotates what KWAMSTER observed; it does not reconstruct positions or the Minecraft world. Space plays or pauses; comma and period step between events.');
}};
function h3Text(parent,text){parent.append(el('h3',null,text));}
function shieldTimeline(parent){const ev=shields.events||[];if(!ev.length)return;const W=900,H=72,L=86,R=12;const{box,svg,t}=chartBox(parent,W,H,'Shield events over time');const tx=v=>L+(W-L-R)*v/dur;
  svgText(svg,8,20,'Opponent');svgText(svg,8,42,'You');for(const y of[14,36])svg.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:'#2a3036'}));
  const color={BLOCK:'var(--good)',DISABLE:'var(--warn)',ESTIMATED_BLOCK:'#2f7f63'};
  for(const e of ev){const y=e.subject==='local'?36:14,x=tx(e.time);const n=e.type==='ESTIMATED_BLOCK'?sv('rect',{x:x-4,y:y-4,width:8,height:8,fill:'none',stroke:color[e.type],'stroke-width':2}):sv('rect',{x:x-4,y:y-4,width:8,height:8,fill:color[e.type]||'#9aa6ac'});hoverTip(n,t,box,cap(e.type)+' at '+num(e.time,2)+' s'+(e.weapon?' · '+item(e.weapon):''));svg.append(n);}
  timeAxis(svg,L,R,48,W,dur);legend(parent,[{name:'Block',color:'var(--good)'},{name:'Disable',color:'var(--warn)'},{name:'Estimated block',color:'#2f7f63',hollow:true}]);}
show(location.hash.slice(1)||'overview');
}
if(ROOT.scopes){
  const host=document.getElementById('session-controls');host.className='controls';
  const participant=document.createElement('select');participant.setAttribute('aria-label','Participant filter');
  const exchange=document.createElement('select');exchange.setAttribute('aria-label','Exchange filter');
  function option(s,value,text){const o=document.createElement('option');o.value=value;o.textContent=text;s.append(o);}
  option(participant,'','All participants');
  for(const p of ROOT.fight.session.participants)option(participant,p.id,p.label||p.id);
  host.append(document.createTextNode('Participant '),participant,document.createTextNode('Exchange '),exchange);
  function refresh(){exchange.replaceChildren();if(!participant.value)option(exchange,'','Entire manual session');
    ROOT.scopes.forEach((p,i)=>{if(!participant.value||p.fight.opponent===participant.value)option(exchange,String(i),'Exchange '+(i+1)+' vs '+(p.opponentLabel||p.fight.opponent||'Unknown'));});
    if(!exchange.options.length){option(exchange,'','No attributed exchange; session overview');}
    render(exchange.value===''?ROOT:ROOT.scopes[Number(exchange.value)]);}
  participant.onchange=refresh;exchange.onchange=()=>render(exchange.value===''?ROOT:ROOT.scopes[Number(exchange.value)]);refresh();
}else render(ROOT);
})();
